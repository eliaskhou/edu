<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Times Tables Game</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #fef6e4 0%, #fdf0d5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 32px 24px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    text-align: center;
  }
  h1 { font-size: 24px; margin: 0 0 24px; color: #333; }
  .app-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  a.app-link {
    display: block;
    background: #ffe3a3;
    color: #7a4e00;
    font-weight: 700;
    font-size: 17px;
    text-decoration: none;
    padding: 16px 20px;
    border-radius: 14px;
    text-align: left;
  }
  a.app-link:active { opacity: 0.8; }
  a.app-link .desc {
    display: block;
    font-weight: 400;
    font-size: 13px;
    color: #9a6b00;
    margin-top: 2px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>Kids apps</h1>
    <div class="app-list">
      <a class="app-link" href="times-tables-game.html">
        Times tables game
        <span class="desc">Practice the 6&ndash;11 times tables with a timer and streaks.</span>
      </a>
    </div>
  </div>
</body>
</html>
