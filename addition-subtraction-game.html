<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Addition et soustraction</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #e8f5fe 0%, #d9edfb 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 24px 20px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 4px;
    color: #333;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #888;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .timer-wrap {
    height: 8px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 0 20px;
  }
  .timer-bar {
    height: 100%;
    background: #2f8fd6;
    width: 100%;
    transition: width 0.1s linear, background 0.2s ease;
  }
  .timer-bar.low { background: #d84343; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { transform: scale(0.95); }
  .mode-btn {
    height: 72px;
    font-size: 18px;
    font-weight: 700;
    background: #cfe8fb;
    color: #1a5a8f;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .stat { text-align: center; }
  .stat-label { font-size: 11px; color: #999; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 22px; font-weight: 700; margin: 2px 0 0; color: #333; }
  .change-btn {
    background: #f0f0f0;
    color: #666;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .question {
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    color: #2d2d2d;
    margin: 20px 0 24px;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .choice-btn {
    height: 60px;
    font-size: 22px;
    font-weight: 700;
    background: #e8f0fe;
    color: #1a4a8f;
    border: 3px solid transparent;
  }
  .choice-btn.correct {
    background: #d9f7e8;
    color: #16794f;
    border-color: #16794f;
  }
  .choice-btn.wrong-fade {
    opacity: 0.4;
  }
  .feedback {
    text-align: center;
    margin-top: 16px;
    font-size: 15px;
    color: #777;
    min-height: 20px;
  }
  .best-banner {
    text-align: center;
    font-size: 14px;
    color: #16794f;
    margin-top: 6px;
    min-height: 18px;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var TIME_LIMIT = 10000; // ms par question, un peu plus de temps pour un enfant de 6 ans
  var state = { mode: null, score: 0, streak: 0, best: 0, question: null, answered: false };
  var timerInterval = null;
  var timerStart = null;

  function pickMode(m){
    state = { mode: m, score: 0, streak: 0, best: 0, question: null, answered: false };
    nextQuestion();
  }

  function nextQuestion(){
    var a, b, answer, symbol;
    if(state.mode === 'add'){
      a = Math.floor(Math.random()*10)+1; // 1..10
      b = Math.floor(Math.random()*10)+1; // 1..10
      answer = a + b;
      symbol = '+';
    } else {
      a = Math.floor(Math.random()*10)+1; // 1..10
      b = Math.floor(Math.random()*a);
      answer = a - b;
      symbol = '-';
    }
    var choices = [answer];
    while(choices.length < 4){
      var offset = Math.floor(Math.random()*7)-3;
      var wrong = answer + offset;
      if(wrong < 0 || wrong === answer) wrong = answer + Math.floor(Math.random()*6)+1;
      if(choices.indexOf(wrong) === -1) choices.push(wrong);
    }
    choices.sort(function(){ return Math.random() - 0.5; });
    state.question = { a: a, b: b, answer: answer, symbol: symbol, choices: choices };
    state.answered = false;
    render();
    startTimer();
    speakQuestion(a, symbol, b);
  }

  function speakQuestion(a, symbol, b){
    try {
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var word = (symbol === '+') ? 'plus' : 'moins';
      var utterance = new SpeechSynthesisUtterance(a + ' ' + word + ' ' + b);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.85;
      utterance.pitch = 1.15;
      window.speechSynthesis.speak(utterance);
    } catch(e) {}
  }

  function startTimer(){
    clearInterval(timerInterval);
    timerStart = Date.now();
    updateTimerBar();
    timerInterval = setInterval(function(){
      var elapsed = Date.now() - timerStart;
      if(elapsed >= TIME_LIMIT){
        clearInterval(timerInterval);
        if(!state.answered) timeUp();
      } else {
        updateTimerBar();
      }
    }, 100);
  }

  function updateTimerBar(){
    var bar = document.getElementById('timer-bar');
    if(!bar) return;
    var elapsed = Date.now() - timerStart;
    var pct = Math.max(0, 100 - (elapsed / TIME_LIMIT) * 100);
    bar.style.width = pct + '%';
    if(pct < 30) bar.classList.add('low'); else bar.classList.remove('low');
  }

  function timeUp(){
    state.answered = true;
    state.streak = 0;
    render();
    setTimeout(nextQuestion, 1300);
  }

  function submit(choice){
    if(state.answered) return;
    state.answered = true;
    clearInterval(timerInterval);
    var wasNewBest = false;
    if(choice === state.question.answer){
      state.score += 10;
      state.streak += 1;
      if(state.streak > state.best){ state.best = state.streak; wasNewBest = state.streak >= 3; }
    } else {
      state.streak = 0;
    }
    render(wasNewBest);
    setTimeout(nextQuestion, 1100);
  }

  function reset(){
    clearInterval(timerInterval);
    state = { mode: null, score: 0, streak: 0, best: 0, question: null, answered: false };
    render();
  }

  function render(newBest){
    var el = document.getElementById('app');

    if(!state.mode){
      el.innerHTML =
        '<h1>Addition et soustraction</h1>' +
        '<p class="subtitle">Choisis ce que tu veux pratiquer</p>' +
        '<div class="grid">' +
          '<button class="mode-btn" onclick="window.__pick(\'add\')">Addition<br>1 à 10</button>' +
          '<button class="mode-btn" onclick="window.__pick(\'sub\')">Soustraction<br>1 à 10</button>' +
        '</div>';
      return;
    }

    var q = state.question;
    var choicesHtml = '';
    q.choices.forEach(function(c){
      var cls = 'choice-btn';
      if(state.answered){
        if(c === q.answer) cls += ' correct';
        else cls += ' wrong-fade';
      }
      choicesHtml += '<button class="'+cls+'" onclick="window.__submit('+c+')">'+c+'</button>';
    });

    var feedback = '';
    if(state.answered){
      feedback = (state.streak > 0)
        ? 'Bravo, bonne réponse !'
        : 'Pas tout à fait. La réponse était ' + q.answer + '.';
    }

    var banner = (newBest) ? 'Nouvelle meilleure série !' : '';

    el.innerHTML =
      '<div class="top-bar">' +
        '<div class="stat"><p class="stat-label">Score</p><p class="stat-value">'+state.score+'</p></div>' +
        '<div class="stat"><p class="stat-label">Série</p><p class="stat-value">'+state.streak+' *</p></div>' +
        '<div class="stat"><p class="stat-label">Record</p><p class="stat-value">'+state.best+'</p></div>' +
        '<button class="change-btn" onclick="window.__reset()">Changer</button>' +
      '</div>' +
      '<div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>' +
      '<p class="question">'+q.a+' '+q.symbol+' '+q.b+' = ?</p>' +
      '<button class="change-btn" style="display:block;margin:0 auto 16px;" onclick="window.__speak('+q.a+',\''+q.symbol+'\','+q.b+')">Réécouter</button>' +
      '<div class="choices">'+choicesHtml+'</div>' +
      '<p class="feedback">'+feedback+'</p>' +
      '<p class="best-banner">'+banner+'</p>';
  }

  window.__pick = pickMode;
  window.__submit = submit;
  window.__reset = reset;
  window.__speak = speakQuestion;
  render();
})();
</script>
</body>
</html>
