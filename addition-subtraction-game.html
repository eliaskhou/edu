<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Addition et soustraction</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #e8f5fe 0%, #d9edfb 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 24px 20px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 4px;
    color: #333;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #888;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .timer-wrap {
    height: 8px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 0 20px;
  }
  .timer-bar {
    height: 100%;
    background: #2f8fd6;
    width: 100%;
    transition: width 0.1s linear, background 0.2s ease;
  }
  .timer-bar.low { background: #d84343; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { transform: scale(0.95); }
  .mode-btn {
    height: 72px;
    font-size: 18px;
    font-weight: 700;
    background: #cfe8fb;
    color: #1a5a8f;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
  }
  .stat { text-align: center; }
  .stat-label { font-size: 11px; color: #999; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 22px; font-weight: 700; margin: 2px 0 0; color: #333; }
  .change-btn {
    background: #f0f0f0;
    color: #666;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .question {
    text-align: center;
    font-size: 40px;
    font-weight: 800;
    color: #2d2d2d;
    margin: 20px 0 24px;
  }
  .choices {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .choice-btn {
    height: 60px;
    font-size: 22px;
    font-weight: 700;
    background: #e8f0fe;
    color: #1a4a8f;
    border: 3px solid transparent;
  }
  .choice-btn.correct {
    background: #d9f7e8;
    color: #16794f;
    border-color: #16794f;
  }
  .choice-btn.wrong-fade {
    opacity: 0.4;
  }
  .feedback {
    text-align: center;
    margin-top: 16px;
    font-size: 15px;
    color: #777;
    min-height: 20px;
  }
  .best-banner {
    text-align: center;
    font-size: 14px;
    color: #16794f;
    margin-top: 6px;
    min-height: 18px;
  }
  .name-input {
    width: 100%;
    font-size: 18px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #cfe8fb;
    margin-bottom: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .name-input:focus { outline: none; border-color: #2f8fd6; }
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 18px;
    font-size: 14px;
  }
  .lb-table th {
    text-align: left;
    padding: 6px 4px;
    color: #999;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #f0f0f0;
  }
  .lb-table td {
    padding: 7px 4px;
    border-bottom: 1px solid #f5f5f5;
  }
  .lb-table td.rank { color: #999; font-weight: 700; width: 24px; }
  .lb-table td.score { text-align: right; font-weight: 700; color: #1a5a8f; }
  .lb-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin: 20px 0 4px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var TIME_LIMIT = 10000; // ms par question, un peu plus de temps pour un enfant de 6 ans
  var ROUND_LENGTH = 20;
  var LB_KEY = 'asg_leaderboard';
  var state = { stage: 'select', mode: null, pendingMode: null, playerName: '', score: 0, streak: 0, best: 0, question: null, answered: false, qIndex: 0, correctCount: 0, leaderboard: [] };
  var timerInterval = null;
  var timerStart = null;

  var MODE_LABELS = { add: 'Addition', sub: 'Soustraction' };

  function getBestScore(mode){
    try { return parseInt(localStorage.getItem('asg_best_' + mode) || '0', 10); } catch(e) { return 0; }
  }
  function setBestScore(mode, val){
    try { localStorage.setItem('asg_best_' + mode, String(val)); } catch(e) {}
  }
  function getLeaderboard(){
    try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch(e) { return []; }
  }
  function addToLeaderboard(entry){
    var lb = getLeaderboard();
    lb.push(entry);
    lb.sort(function(a,b){ return b.score - a.score; });
    lb = lb.slice(0, 10);
    try { localStorage.setItem(LB_KEY, JSON.stringify(lb)); } catch(e) {}
    return lb;
  }

  function pickMode(m){
    state.pendingMode = m;
    state.stage = 'name';
    render();
    setTimeout(function(){
      var inp = document.getElementById('nameInput');
      if(inp) inp.focus();
    }, 50);
  }

  function confirmName(){
    var inp = document.getElementById('nameInput');
    var val = inp ? inp.value.trim() : '';
    var name = val !== '' ? val : 'Joueur';
    var m = state.pendingMode;
    state = { stage: 'playing', mode: m, pendingMode: null, playerName: name, score: 0, streak: 0, best: 0, question: null, answered: false, qIndex: 0, correctCount: 0, leaderboard: [] };
    nextQuestion();
  }

  function nextQuestion(){
    state.qIndex += 1;
    if(state.qIndex > ROUND_LENGTH){
      endRound();
      return;
    }
    var a, b, answer, symbol;
    if(state.mode === 'add'){
      a = Math.floor(Math.random()*10)+1;
      b = Math.floor(Math.random()*10)+1;
      answer = a + b;
      symbol = '+';
    } else {
      a = Math.floor(Math.random()*10)+1;
      b = Math.floor(Math.random()*a);
      answer = a - b;
      symbol = '-';
    }
    var choices = [answer];
    while(choices.length < 4){
      var offset = Math.floor(Math.random()*7)-3;
      var wrong = answer + offset;
      if(wrong < 0 || wrong === answer) wrong = answer + Math.floor(Math.random()*6)+1;
      if(choices.indexOf(wrong) === -1) choices.push(wrong);
    }
    choices.sort(function(){ return Math.random() - 0.5; });
    state.question = { a: a, b: b, answer: answer, symbol: symbol, choices: choices };
    state.answered = false;
    render();
    startTimer();
    speakQuestion(a, symbol, b);
  }

  function endRound(){
    clearInterval(timerInterval);
    state.stage = 'over';
    var prevBest = getBestScore(state.mode);
    var isNewBest = state.score > prevBest;
    if(isNewBest) setBestScore(state.mode, state.score);
    state.leaderboard = addToLeaderboard({ name: state.playerName, score: state.score, mode: state.mode });
    render(false, isNewBest);
  }

  function speakQuestion(a, symbol, b){
    try {
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var word = (symbol === '+') ? 'plus' : 'moins';
      var utterance = new SpeechSynthesisUtterance(a + ' ' + word + ' ' + b);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.85;
      utterance.pitch = 1.15;
      window.speechSynthesis.speak(utterance);
    } catch(e) {}
  }

  function startTimer(){
    clearInterval(timerInterval);
    timerStart = Date.now();
    updateTimerBar();
    timerInterval = setInterval(function(){
      var elapsed = Date.now() - timerStart;
      if(elapsed >= TIME_LIMIT){
        clearInterval(timerInterval);
        if(!state.answered) timeUp();
      } else {
        updateTimerBar();
      }
    }, 100);
  }

  function updateTimerBar(){
    var bar = document.getElementById('timer-bar');
    if(!bar) return;
    var elapsed = Date.now() - timerStart;
    var pct = Math.max(0, 100 - (elapsed / TIME_LIMIT) * 100);
    bar.style.width = pct + '%';
    if(pct < 30) bar.classList.add('low'); else bar.classList.remove('low');
  }

  function timeUp(){
    state.answered = true;
    state.streak = 0;
    render();
    setTimeout(nextQuestion, 1300);
  }

  function submit(choice){
    if(state.answered) return;
    state.answered = true;
    clearInterval(timerInterval);
    var wasNewBest = false;
    if(choice === state.question.answer){
      state.score += 10;
      state.streak += 1;
      state.correctCount += 1;
      if(state.streak > state.best){ state.best = state.streak; wasNewBest = state.streak >= 3; }
    } else {
      state.streak = 0;
    }
    render(wasNewBest);
    setTimeout(nextQuestion, 1100);
  }

  function reset(){
    clearInterval(timerInterval);
    state = { stage: 'select', mode: null, pendingMode: null, playerName: '', score: 0, streak: 0, best: 0, question: null, answered: false, qIndex: 0, correctCount: 0, leaderboard: [] };
    render();
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function leaderboardHtml(){
    if(state.leaderboard.length === 0) return '';
    var rows = state.leaderboard.map(function(e, i){
      return '<tr><td class="rank">'+(i+1)+'</td><td>'+escapeHtml(e.name)+'</td><td>'+MODE_LABELS[e.mode]+'</td><td class="score">'+e.score+'</td></tr>';
    }).join('');
    return '<p class="lb-title">Les 10 meilleurs scores</p>' +
      '<table class="lb-table"><thead><tr><th>#</th><th>Prénom</th><th>Mode</th><th style="text-align:right;">Score</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function render(newBest, roundNewBest){
    var el = document.getElementById('app');

    if(state.stage === 'select'){
      var recAdd = getBestScore('add');
      var recSub = getBestScore('sub');
      el.innerHTML =
        '<h1>Addition et soustraction</h1>' +
        '<p class="subtitle">Choisis ce que tu veux pratiquer (20 questions)</p>' +
        '<div class="grid">' +
          '<button class="mode-btn" onclick="window.__pick(\'add\')">Addition<br>1 à 10' +
          (recAdd > 0 ? '<br><span style="font-size:11px;font-weight:400;">Record : '+recAdd+'</span>' : '') + '</button>' +
          '<button class="mode-btn" onclick="window.__pick(\'sub\')">Soustraction<br>1 à 10' +
          (recSub > 0 ? '<br><span style="font-size:11px;font-weight:400;">Record : '+recSub+'</span>' : '') + '</button>' +
        '</div>';
      return;
    }

    if(state.stage === 'name'){
      el.innerHTML =
        '<h1>'+MODE_LABELS[state.pendingMode]+'</h1>' +
        '<p class="subtitle">Quel est ton prénom ?</p>' +
        '<input type="text" id="nameInput" class="name-input" placeholder="Ton prénom" maxlength="20" onkeydown="if(event.key===\'Enter\')window.__confirmName()">' +
        '<button class="mode-btn" style="width:100%;" onclick="window.__confirmName()">Commencer</button>';
      return;
    }

    if(state.stage === 'over'){
      var pct = Math.round((state.correctCount / ROUND_LENGTH) * 100);
      el.innerHTML =
        '<h1>Tour terminé !</h1>' +
        '<p class="subtitle">'+escapeHtml(state.playerName)+' — '+MODE_LABELS[state.mode]+'</p>' +
        '<div style="text-align:center;margin:20px 0;">' +
          '<p class="stat-label">Score final</p>' +
          '<p style="font-size:44px;font-weight:800;color:#1a5a8f;margin:4px 0;">'+state.score+'</p>' +
          '<p style="font-size:15px;color:#666;margin:0;">'+state.correctCount+' / '+ROUND_LENGTH+' bonnes réponses ('+pct+'%)</p>' +
          '<p style="font-size:15px;color:#16794f;margin:6px 0 0;">'+(roundNewBest ? 'Nouveau record !' : 'Meilleur score : '+getBestScore(state.mode))+'</p>' +
        '</div>' +
        '<div class="grid">' +
          '<button class="mode-btn" onclick="window.__pick(\''+state.mode+'\')">Rejouer</button>' +
          '<button class="mode-btn" onclick="window.__reset()">Changer</button>' +
        '</div>' +
        leaderboardHtml();
      return;
    }

    var q = state.question;
    var choicesHtml = '';
    q.choices.forEach(function(c){
      var cls = 'choice-btn';
      if(state.answered){
        if(c === q.answer) cls += ' correct';
        else cls += ' wrong-fade';
      }
      choicesHtml += '<button class="'+cls+'" onclick="window.__submit('+c+')">'+c+'</button>';
    });

    var feedback = '';
    if(state.answered){
      feedback = (state.streak > 0)
        ? 'Bravo, bonne réponse !'
        : 'Pas tout à fait. La réponse était ' + q.answer + '.';
    }

    var banner = (newBest) ? 'Nouvelle meilleure série !' : '';

    el.innerHTML =
      '<div class="top-bar">' +
        '<div class="stat"><p class="stat-label">Question</p><p class="stat-value">'+state.qIndex+'/'+ROUND_LENGTH+'</p></div>' +
        '<div class="stat"><p class="stat-label">Score</p><p class="stat-value">'+state.score+'</p></div>' +
        '<div class="stat"><p class="stat-label">Série</p><p class="stat-value">'+state.streak+' *</p></div>' +
        '<button class="change-btn" onclick="window.__reset()">Changer</button>' +
      '</div>' +
      '<div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>' +
      '<p class="question">'+q.a+' '+q.symbol+' '+q.b+' = ?</p>' +
      '<button class="change-btn" style="display:block;margin:0 auto 16px;" onclick="window.__speak('+q.a+',\''+q.symbol+'\','+q.b+')">Réécouter</button>' +
      '<div class="choices">'+choicesHtml+'</div>' +
      '<p class="feedback">'+feedback+'</p>' +
      '<p class="best-banner">'+banner+'</p>';
  }

  window.__pick = pickMode;
  window.__confirmName = confirmName;
  window.__submit = submit;
  window.__reset = reset;
  window.__speak = speakQuestion;
  render();
})();
</script>
</body>
</html>
