<style>

.cards4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #f7f7f7; border-radius: 12px; padding: 10px 4px; margin-bottom: 4px; }
.chart { width: 100%; height: auto; }
.legend { text-align: center; font-size: 12px; color: #888; margin: 2px 0 0; }

.barrow { margin: 8px 0; }

.pins { display: flex; justify-content: center; gap: 12px; margin: 10px 0 2px; }
.pin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid var(--a); }
.pin.on { background: var(--a); }
.tabs { display: flex; background: #f0f0f0; border-radius: 12px; padding: 3px; margin: 8px 0 14px; }

.tabs button.on { background: var(--a); color: #fff; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f2f2f2; }
.row.col { flex-direction: column; align-items: stretch; }
.row-l { font-size: 15px; }

.stepper { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

.stepper span { min-width: 34px; text-align: center; font-weight: 700; font-size: 16px; }
.switch { width: 52px; height: 30px; background: #ccc; border-radius: 15px; position: relative; padding: 0; flex-shrink: 0; }

.switch.on { background: var(--a); }

.prow .acts { display: flex; gap: 6px; flex-wrap: wrap; width: 100%; }
.ta { width: 100%; font-family: monospace; font-size: 12px; border: 2px solid #eee; border-radius: 10px; padding: 8px; resize: vertical; }
.filelbl { position: relative; overflow: hidden; }

@media (prefers-reduced-motion: reduce) {
  .stars.fresh .star.on, .confetti i { animation: none; }
  .confetti { display: none; }
}
.vis .cap { font-size: 13px; color: #888; margin-top: 2px; }
.money { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.money svg { height: 46px; width: auto; }

@media (min-width: 700px) {
  #app { max-width: 560px; padding: 28px 28px 32px; }
  h1 { font-size: 26px; }
  .question { font-size: 40px; } .question.m1 { font-size: 32px; } .question.m2 { font-size: 26px; } .question.long { font-size: 21px; }
  .key-btn { height: 62px; }
  .choice-btn { min-height: 72px; font-size: 18px; }
  .mode-btn { min-height: 76px; }
}

<body>
<div id="app"></div>
<script>
(function(global){
'use strict';
/* ===== Moteur commun : utilitaires, stockage, aides pédagogiques ===== */
var CFG = null, REG = {}, S = { stage: 'boot', training: false, lbView: 'me', ptab: 'settings' };
var R = null, PD = null, PROFILE = null;
var qTimer = null, cdTimer = null, advTimer = null;
var KE = {};

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){
  var a = arr.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function pick(arr){ return arr[randInt(0, arr.length - 1)]; }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function gcd(a, b){ return b === 0 ? a : gcd(b, a % b); }
// Nombre au format français (virgule), 3 décimales maximum
function fmt(x){
  var r = Math.round(x * 1000) / 1000;
  return String(r).replace('.', ',');
}
// Entier "centièmes" -> texte français (350 -> "3,5", 275 -> "2,75", 300 -> "3")
function dec(x100){
  var neg = x100 < 0; if(neg) x100 = -x100;
  var ent = Math.floor(x100 / 100), cent = x100 % 100;
  var s = String(ent);
  if(cent !== 0){ s += ',' + (cent < 10 ? '0' + cent : (cent % 10 === 0 ? String(cent / 10) : String(cent))); }
  return (neg ? '-' : '') + s;
}
function buildChoices(correct, distractors, n){
  n = n || 4;
  correct = String(correct);
  var pool = [];
  distractors.forEach(function(d){
    d = String(d);
    if(d !== correct && pool.indexOf(d) === -1) pool.push(d);
  });
  if(pool.length < n - 1) throw new Error('Pas assez de distracteurs pour : ' + correct);
  pool = shuffle(pool).slice(0, n - 1);
  return shuffle(pool.concat([correct]));
}

/* ---------- Stockage (localStorage avec repli mémoire) ---------- */
var mem = {};
var Store = {
  get: function(k, def){
    try {
      var v = global.localStorage.getItem(k);
      if(v === null || v === undefined) return (k in mem) ? JSON.parse(mem[k]) : def;
      return JSON.parse(v);
    } catch(e){ return (k in mem) ? JSON.parse(mem[k]) : def; }
  },
  set: function(k, v){
    var s = JSON.stringify(v);
    try { global.localStorage.setItem(k, s); delete mem[k]; return true; }
    catch(e){ mem[k] = s; return false; }
  },
  remove: function(k){
    try { global.localStorage.removeItem(k); } catch(e){}
    delete mem[k];
  }
};

/* ---------- Dates ---------- */
function dstr(d){
  var m = d.getMonth() + 1, day = d.getDate();
  return d.getFullYear() + '-' + (m < 10 ? '0' : '') + m + '-' + (day < 10 ? '0' : '') + day;
}
function today(){ return dstr(new Date()); }

/* ---------- Explications pédagogiques réutilisables ---------- */
var explain = {};
explain.add = function(a, b){
  var s = a + b, big = Math.max(a, b), sm = Math.min(a, b);
  if(s <= 10) return a + ' + ' + b + ' : pars de ' + big + ' et avance de ' + sm + ' sur tes doigts : tu arrives à ' + s + '.';
  if(a < 10 && b < 10){
    var need = 10 - big, rest = sm - need;
    return a + ' + ' + b + ' : d\'abord ' + big + ' + ' + need + ' = 10, puis 10 + ' + rest + ' = ' + s + '.';
  }
  var tens = Math.floor(sm / 10) * 10, units = sm % 10;
  if(sm < 10){
    var toTen = 10 - (big % 10);
    if(big % 10 !== 0 && toTen < sm){
      return a + ' + ' + b + ' : complète d\'abord la dizaine : ' + big + ' + ' + toTen + ' = ' + (big + toTen) + ', puis + ' + (sm - toTen) + ' = ' + s + '.';
    }
    return a + ' + ' + b + ' : ajoute les unités : ' + (big % 10) + ' + ' + sm + ' = ' + ((big % 10) + sm) + ', donc ' + s + '.';
  }
  if(units === 0) return a + ' + ' + b + ' : ajoute directement les dizaines (ou les centaines) : ' + big + ' + ' + sm + ' = ' + s + '.';
  return a + ' + ' + b + ' : décompose ' + sm + ' en ' + tens + ' + ' + units + '. D\'abord ' + big + ' + ' + tens + ' = ' + (big + tens) + ', puis + ' + units + ' = ' + s + '.';
};
explain.sub = function(a, b){
  var r = a - b;
  if(a <= 20 && b <= 10) return a + ' - ' + b + ' : demande-toi combien il faut ajouter à ' + b + ' pour arriver à ' + a + '. ' + b + ' + ' + r + ' = ' + a + ', donc ' + a + ' - ' + b + ' = ' + r + '.';
  if(b < 10 && a > 10){
    var comp = 10 - b;
    return a + ' - ' + b + ' : c\'est comme ' + a + ' - 10 + ' + comp + '. ' + a + ' - 10 = ' + (a - 10) + ', puis + ' + comp + ' = ' + r + '.';
  }
  if(b % 100 === 0) return a + ' - ' + b + ' : retire seulement les centaines : ' + (b / 100) + ' centaine(s) en moins, donc ' + r + '.';
  if(b % 10 === 0) return a + ' - ' + b + ' : retire seulement les dizaines : ' + (b / 10) + ' dizaine(s) en moins, donc ' + r + '.';
  var tens = Math.floor(b / 10) * 10, units = b % 10;
  return a + ' - ' + b + ' : décompose ' + b + ' en ' + tens + ' + ' + units + '. ' + a + ' - ' + tens + ' = ' + (a - tens) + ', puis - ' + units + ' = ' + r + '.';
};
explain.mul = function(a, b){
  var p = a * b, n;
  if(a === 10 || b === 10){ n = (a === 10) ? b : a; return n + ' × 10 : ajoute un zéro à la fin de ' + n + ' → ' + p + '.'; }
  if(a === 100 || b === 100){ n = (a === 100) ? b : a; return n + ' × 100 : ajoute deux zéros à la fin de ' + n + ' → ' + p + '.'; }
  if(b % 10 === 0 && b > 10) return a + ' × ' + b + ' : multiplie ' + a + ' × ' + (b / 10) + ' = ' + (a * (b / 10)) + ', puis ajoute le zéro de ' + b + ' → ' + p + '.';
  if(a % 10 === 0 && a > 10) return a + ' × ' + b + ' : multiplie ' + (a / 10) + ' × ' + b + ' = ' + ((a / 10) * b) + ', puis ajoute le zéro de ' + a + ' → ' + p + '.';
  if(a < 10 && b < 10) return a + ' × ' + b + ' : utilise la table de multiplication de ' + b + ' (ou de ' + a + ').';
  var big = Math.max(a, b), sm = Math.min(a, b), t = Math.floor(big / 10) * 10, u = big % 10;
  return a + ' × ' + b + ' : décompose ' + big + ' en ' + t + ' + ' + u + '. (' + t + ' × ' + sm + ') + (' + u + ' × ' + sm + ') = ' + (t * sm) + ' + ' + (u * sm) + ' = ' + p + '.';
};
explain.div = function(n, d, q){
  if(d === 10) return n + ' : 10 : diviser par 10 revient à enlever un zéro : ' + n + ' : 10 = ' + q + '.';
  if(d === 100) return n + ' : 100 : diviser par 100 revient à enlever deux zéros : ' + n + ' : 100 = ' + q + '.';
  if(d === 2) return n + ' : 2 : c\'est la moitié de ' + n + '. ' + q + ' + ' + q + ' = ' + n + ', donc la réponse est ' + q + '.';
  return n + ' : ' + d + ' : demande-toi « combien de fois ' + d + ' dans ' + n + ' ? ». Comme ' + q + ' × ' + d + ' = ' + n + ', la réponse est ' + q + '.';
};
explain.dbl = function(n){
  if(n < 10) return 'Le double de ' + n + ' : ' + n + ' + ' + n + ' = ' + (2 * n) + '.';
  var t = Math.floor(n / 10) * 10, u = n % 10;
  if(u === 0) return 'Le double de ' + n + ' : ' + (n / 10) + ' dizaines + ' + (n / 10) + ' dizaines = ' + (n / 5) + ' dizaines = ' + (2 * n) + '.';
  return 'Le double de ' + n + ' : double de ' + t + ' = ' + (2 * t) + ' et double de ' + u + ' = ' + (2 * u) + '. ' + (2 * t) + ' + ' + (2 * u) + ' = ' + (2 * n) + '.';
};
explain.half = function(n){
  var h = n / 2;
  if(n < 20) return 'La moitié de ' + n + ' : partage en 2 parts égales. ' + h + ' + ' + h + ' = ' + n + '.';
  var t = Math.floor(n / 20) * 20, rest = n - t;
  return 'La moitié de ' + n + ' : moitié de ' + t + ' = ' + (t / 2) + (rest ? ' et moitié de ' + rest + ' = ' + (rest / 2) + '. ' + (t / 2) + ' + ' + (rest / 2) + ' = ' + h + '.' : '.');
};

/* ---------- Visuels (SVG) réutilisables ---------- */
var vis = {};
vis.dots = function(groups, per){
  var r = 5, step = 14, gap = 8;
  var w = per * step + 6, h = groups * step + (groups - 1) * gap + 6;
  var s = '<svg class="vis-svg" viewBox="0 0 ' + w + ' ' + h + '" style="max-width:' + Math.min(300, w * 2) + 'px" role="img" aria-label="' + groups + ' groupes de ' + per + ' points">';
  for(var g = 0; g < groups; g++){
    for(var k = 0; k < per; k++){
      s += '<circle cx="' + (3 + step / 2 + k * step) + '" cy="' + (3 + step / 2 + g * (step + gap)) + '" r="' + r + '" fill="var(--a)"/>';
    }
  }
  return s + '</svg>';
};
vis.clock = function(h, m){
  var s = '<svg class="vis-svg" viewBox="0 0 140 140" style="max-width:190px" role="img" aria-label="Horloge">';
  s += '<circle cx="70" cy="70" r="66" fill="#fff" stroke="var(--ad)" stroke-width="4"/>';
  var i, a, x1, y1, x2, y2;
  for(i = 0; i < 60; i++){
    a = i * 6 * Math.PI / 180;
    var r1 = (i % 5 === 0) ? 55 : 59;
    x1 = 70 + Math.sin(a) * r1; y1 = 70 - Math.cos(a) * r1;
    x2 = 70 + Math.sin(a) * 62; y2 = 70 - Math.cos(a) * 62;
    s += '<line x1="' + x1.toFixed(1) + '" y1="' + y1.toFixed(1) + '" x2="' + x2.toFixed(1) + '" y2="' + y2.toFixed(1) + '" stroke="#555" stroke-width="' + (i % 5 === 0 ? 2 : 1) + '"/>';
  }
  for(i = 1; i <= 12; i++){
    a = i * 30 * Math.PI / 180;
    x1 = 70 + Math.sin(a) * 45; y1 = 70 - Math.cos(a) * 45;
    s += '<text x="' + x1.toFixed(1) + '" y="' + (y1 + 4.2).toFixed(1) + '" text-anchor="middle" font-size="12" font-weight="700" fill="#333">' + i + '</text>';
  }
  var ha = (((h % 12) + m / 60) * 30) * Math.PI / 180;
  var ma = (m * 6) * Math.PI / 180;
  s += '<line x1="70" y1="70" x2="' + (70 + Math.sin(ha) * 26).toFixed(1) + '" y2="' + (70 - Math.cos(ha) * 26).toFixed(1) + '" stroke="var(--ad)" stroke-width="6" stroke-linecap="round"/>';
  s += '<line x1="70" y1="70" x2="' + (70 + Math.sin(ma) * 35).toFixed(1) + '" y2="' + (70 - Math.cos(ma) * 35).toFixed(1) + '" stroke="var(--a)" stroke-width="3.5" stroke-linecap="round"/>';
  s += '<circle cx="70" cy="70" r="4" fill="#333"/></svg>';
  return s;
};

function ensureProfiles(){
  var old = Store.get('ke_profiles', []), cur = Store.get('ke_current', null), i, f, k;
  function fixedFor(p){ for(var j = 0; j < FIXED.length; j++){ if(FIXED[j].id === p.id || String(p.name).trim().toLowerCase() === FIXED[j].name.toLowerCase()) return FIXED[j]; } return null; }

/* ---------- Statistiques ---------- */
function bump(cat, ok){
  var key = CFG.id + '|' + cat;
  var s = PD.stats[key];
  if(!s){ s = PD.stats[key] = { l: cat, a: CFG.title, ok: 0, ko: 0 }; }
  if(ok) s.ok++; else s.ko++;
  var d = today();
  var dy = PD.daily[d] || (PD.daily[d] = { ok: 0, ko: 0 });
  if(ok) dy.ok++; else dy.ko++;
}
function dayStreak(){
  var n = 0, d = new Date();
  var t = PD.daily[dstr(d)];
  if(!(t && (t.ok + t.ko) > 0)) d.setDate(d.getDate() - 1);
  for(;;){
    var e = PD.daily[dstr(d)];
    if(e && (e.ok + e.ko) > 0){ n++; d.setDate(d.getDate() - 1); } else break;
    if(n > 3650) break;
  }
  return n;
}

function evalBadges(res, prevRecord){
  var got = [], ds = dayStreak(), appsPlayed = 0, k;
  for(k in PD.cnt.apps){ if(PD.cnt.apps[k] > 0) appsPlayed++; }
  var avg = res.avg || 0;
  var tests = {
    first:   PD.cnt.rounds >= 1,
    perfect: res.n >= 10 && res.ok === res.n,
    s5:      res.best >= 5,
    s10:     res.best >= 10,
    s15:     res.best >= 15,
    fast:    res.ok >= 10 && avg > 0 && avg < 5000 && res.ok / res.n >= 0.8,
    rec:     res.newRecord && prevRecord > 0,

    c100:    PD.cnt.ok >= 100,
    c500:    PD.cnt.ok >= 500,

    d7:      ds >= 7,

  };

/* ===== Moteur commun : déroulement d'un tour ===== */
function modeByKey(k){
  for(var i = 0; i < CFG.modes.length; i++){ if(CFG.modes[i].key === k) return CFG.modes[i]; }
  return null;
}
function clearTimers(){
  clearInterval(qTimer); clearInterval(cdTimer); clearTimeout(advTimer);
  qTimer = null; cdTimer = null; advTimer = null;
}

function startRound(modeKey, pool){
  var m = modeByKey(modeKey);
  if(!m) return;
  var st = getSettings();
  var cd = !!m.countdown;
  R = {
    mode: m, revision: !!pool, pool: pool || null,
    training: !!pool || (S.training && !cd),
    n: pool ? pool.length : st.rounds,
    idx: 0, ok: 0, ko: 0, score: 0, streak: 0, best: 0,
    q: null, answered: false, input: '', chosen: -1, last: null,
    errors: [], times: [], banner: false, limit: 0, qStart: 0, endTs: 0
  };
  if(cd) R.endTs = Date.now() + m.countdown * 1000;
  S.stage = 'playing';
  clearTimers();
  if(cd){ cdTimer = setInterval(cdTick, 250); }
  nextQuestion();
}

function makeQuestion(){
  var P = getSettings().params, q = null, g, tries = 0;
  var prev = R.q ? R.q.text : '';
  while(tries < 40){
    tries++;
    g = R.pool ? REG[R.pool[(R.idx - 1) % R.pool.length]] : pick(R.mode.gens);
    if(!g) continue;
    try { q = g.fn(P); } catch(e){ q = null; continue; }
    if(!q || !q.text) { q = null; continue; }
    if(q.choices){
      if(q.choices.indexOf(q.answer) === -1){ q = null; continue; }
    } else if(typeof q.answer !== 'number' || !isFinite(q.answer)){ q = null; continue; }
    if(q.text === prev && tries < 15 && !R.pool){ q = null; continue; }
    q.genId = g.id; q.cat = g.cat;
    q.type = q.choices ? 'choices' : 'number';
    break;
  }
  if(!q){
    q = { text: '2 + 2 = ?', answer: 4, explanation: '2 + 2 = 4.', speak: '2 plus 2', genId: '_fallback', cat: 'Divers', type: 'number' };
  }
  return q;
}

function nextQuestion(){
  advTimer = null;
  if(!R || S.stage !== 'playing') return;
  if(R.mode.countdown){
    if(Date.now() >= R.endTs){ finish(); return; }
  } else if(R.idx >= R.n){ finish(); return; }
  R.idx++;
  R.q = makeQuestion();
  R.answered = false; R.input = ''; R.chosen = -1; R.banner = false; R.last = null;
  render();
  startQTimer();
  speakQ();
}

function qBaseTime(){ return R.q.time || R.mode.time || CFG.defaultTime || 15000; }

function startQTimer(){
  clearInterval(qTimer);
  var st = getSettings();
  R.qStart = Date.now();
  if(R.training || R.mode.countdown || st.tf === 0){ R.limit = 0; return; }
  R.limit = Math.round(qBaseTime() * st.tf);
  updateBar();
  qTimer = setInterval(function(){
    if(!R || R.answered){ clearInterval(qTimer); return; }
    if(Date.now() - R.qStart >= R.limit){ clearInterval(qTimer); settle(false, null, true); }
    else updateBar();
  }, 100);
}

function mmss(ms){
  var s = Math.max(0, Math.ceil(ms / 1000)), m = Math.floor(s / 60), r = s % 60;
  return m + ':' + (r < 10 ? '0' : '') + r;
}
function updateBar(){
  var bar = document.getElementById('tbar');
  if(!R || !bar) return;
  var pct;
  if(R.mode.countdown){
    var total = R.mode.countdown * 1000, left = Math.max(0, R.endTs - Date.now());
    pct = left / total * 100;
    var tx = document.getElementById('cdtxt');
    if(tx) tx.textContent = mmss(left);
  } else if(R.limit > 0){
    pct = Math.max(0, 100 - (Date.now() - R.qStart) / R.limit * 100);
  } else return;
  bar.style.width = pct + '%';
  if(pct < 30) bar.className = 'timer-bar low'; else bar.className = 'timer-bar';
}
function cdTick(){
  if(!R || S.stage !== 'playing' || !R.mode.countdown){ clearInterval(cdTimer); return; }
  if(Date.now() >= R.endTs){ finish(); return; }
  updateBar();
}

function speakQ(){
  try {
    if(!getSettings().voice || !global.speechSynthesis || !R || !R.q) return;
    global.speechSynthesis.cancel();
    var u = new global.SpeechSynthesisUtterance(R.q.speak || R.q.text);
    u.lang = CFG.voiceLang || 'fr-FR'; u.rate = 0.9; u.pitch = 1.05;
    global.speechSynthesis.speak(u);
  } catch(e){}
}

function answerLabel(q){
  if(q.type === 'choices') return String(q.answer);
  return fmt(q.answer) + (q.unit ? ' ' + q.unit : '');
}

// Enregistre le résultat d'une question (juste, faux ou temps écoulé)
function settle(correct, given, timeout){
  if(!R || R.answered) return;
  R.answered = true;
  clearInterval(qTimer);
  var q = R.q;
  bump(q.cat, correct);
  if(correct){
    R.ok++; R.score += 10; R.streak++;
    R.times.push(Date.now() - R.qStart);
    if(R.streak > R.best){ R.best = R.streak; R.banner = R.streak >= 3; }
  } else {
    R.ko++; R.streak = 0;
    R.errors.push({
      text: q.text, answer: answerLabel(q),
      given: timeout ? 'Pas de réponse (temps écoulé)' : (given === null || given === '' ? '—' : String(given) + (q.type === 'number' && q.unit ? ' ' + q.unit : '')),
      explanation: q.explanation || '', genId: q.genId
    });
  }
  R.last = { correct: correct, timeout: !!timeout };
  persist();
  render();
  if(!R.training){
    advTimer = setTimeout(nextQuestion, correct ? (R.mode.countdown ? 500 : 1100) : (R.mode.countdown ? 1200 : 1600));
  }
}

function finish(){
  clearTimers();
  if(!R) return;
  var total = R.ok + R.ko;
  var pct = total ? Math.round(R.ok * 100 / total) : 0;
  var stars = pct >= 90 ? 3 : (pct >= 70 ? 2 : (pct >= 40 ? 1 : 0));
  var avg = 0;
  if(R.times.length){ var sum = 0; R.times.forEach(function(t){ sum += t; }); avg = sum / R.times.length; }
  var scored = !R.training && !R.revision;
  var res = {
    mode: R.mode, ok: R.ok, n: total, score: R.score, pct: pct, stars: stars, best: R.best,
    errors: R.errors, training: R.training, revision: R.revision, scored: scored,
    countdown: !!R.mode.countdown, newBadges: [], newRecord: false, prevRecord: 0, avg: avg
  };
  if(scored && total > 0){
    var rk = CFG.id + '|' + R.mode.key;
    var prev = PD.rec[rk] || 0;
    res.prevRecord = prev;
    if(R.score > prev){ res.newRecord = true; PD.rec[rk] = R.score; }
    var arr = PD.lb[CFG.id] || [];
    arr.push({ m: R.mode.key, ml: R.mode.name || R.mode.label, s: R.score, ok: R.ok, n: total, d: today() });
    arr.sort(function(a, b){ return b.s - a.s; });
    PD.lb[CFG.id] = arr.slice(0, 10);
    PD.hist.push({ d: today(), a: CFG.id, at: CFG.title, ml: R.mode.name || R.mode.label, s: R.score, ok: R.ok, n: total });
    if(PD.hist.length > 40) PD.hist = PD.hist.slice(PD.hist.length - 40);
    PD.cnt.rounds++; PD.cnt.ok += R.ok;
    PD.cnt.apps[CFG.id] = (PD.cnt.apps[CFG.id] || 0) + 1;
    res.newBadges = evalBadges(res, prev);
  }
  persist();
  S.res = res; S.stage = 'over'; S.lbView = 'me';
  R = null;
  render();
}

function quitRound(){
  clearTimers();
  try { if(global.speechSynthesis) global.speechSynthesis.cancel(); } catch(e){}
  R = null; S.stage = 'select';
  render();
}

function onVisibility(){
  if(document.hidden){ onVisibility.at = Date.now(); return; }
  if(onVisibility.at && R && S.stage === 'playing'){
    var dt = Date.now() - onVisibility.at;
    R.qStart += dt;
    if(R.endTs) R.endTs += dt;
  }
  onVisibility.at = 0;
}

/* ---------- Jeu ---------- */
function vPlaying(){
  var q = R.q, m = R.mode, h = '';
  var top = '<div class="top-bar">';
  if(m.countdown){
    top += stat('Temps', '<span id="cdtxt">' + mmss(Math.max(0, R.endTs - Date.now())) + '</span>') + stat('Score', R.score) + stat('Série', R.streak + ' *');
  } else if(R.training){
    top += stat('Question', R.idx + '/' + R.n) + stat('Réussies', R.ok);
  } else {
    top += stat('Question', R.idx + '/' + R.n) + stat('Score', R.score) + stat('Série', R.streak + ' *');
  }
  top += '<button class="chip-btn" onclick="KE.quit()">Changer</button></div>';
  h += top;
  if(R.limit > 0 || m.countdown) h += '<div class="timer-wrap"><div class="timer-bar" id="tbar"></div></div>';
  else if(R.training) h += '<p class="mode-note">' + (R.revision ? 'Révision de tes erreurs' : 'Entraînement') + ' : prends ton temps</p>';
  var ql = q.text.length;
  h += '<p class="question' + (ql <= 15 ? '' : (ql <= 26 ? ' m1' : (ql <= 46 ? ' m2' : ' long'))) + '">' + esc(q.text) + '</p>';
  if(q.html) h += '<div class="vis">' + q.html + '</div>';
  if(getSettings().voice && global.speechSynthesis) h += '<button class="chip-btn hear" onclick="KE.speak()">Réécouter</button>';
  var ans = R.answered, last = R.last;
  if(q.type === 'choices'){
    h += '<div class="choices">';
    q.choices.forEach(function(c, i){
      var cls = 'choice-btn';
      if(ans){
        if(c === q.answer) cls += ' correct';
        else if(i === R.chosen) cls += ' wrong';
        else cls += ' fade';
      }
      h += '<button class="' + cls + '" onclick="KE.choose(' + i + ')">' + esc(c) + '</button>';
    });
    h += '</div>';
  } else {
    var dc = 'answer-display' + (ans ? (last && last.correct ? ' correct-flash' : ' wrong-flash') : '');
    var shown = R.input !== '' ? esc(R.input) : (ans ? esc(fmt(q.answer)) : '&nbsp;');
    h += '<div class="' + dc + '">' + shown + (q.unit ? ' <span class="unit">' + esc(q.unit) + '</span>' : '') + '</div>';
    var dis = ans ? ' disabled' : '';
    h += '<div class="keypad">';
    for(var d = 1; d <= 9; d++) h += '<button class="key-btn"' + dis + ' onclick="KE.key(' + d + ')">' + d + '</button>';
    h += '<button class="key-btn action comma"' + ((ans || !q.decimal) ? ' disabled' : '') + ' onclick="KE.key(\',\')">,</button>';
    h += '<button class="key-btn"' + dis + ' onclick="KE.key(0)">0</button>';
    h += '<button class="key-btn action"' + dis + ' onclick="KE.back()">&#8592;</button></div>';
    h += '<div class="kp-actions"><button class="key-btn action"' + dis + ' onclick="KE.clear()">Effacer</button><button class="key-btn validate"' + dis + ' onclick="KE.validate()">Valider</button></div>';
  }
  if(ans){
    var fb;
    if(last.correct) fb = 'Bravo, bonne réponse !';
    else if(last.timeout) fb = 'Temps écoulé. La réponse était : ' + answerLabel(q) + '.';
    else fb = 'Pas tout à fait. La réponse était : ' + answerLabel(q) + '.';
    h += '<p class="feedback">' + esc(fb) + '</p>';
    if(R.training && q.explanation) h += '<div class="explain"><b>Astuce :</b> ' + esc(q.explanation) + '</div>';
    if(R.training) h += '<button class="mode-btn wide next" onclick="KE.next()">' + (R.idx >= R.n ? 'Voir le résultat' : 'Question suivante') + '</button>';
  } else h += '<p class="feedback">&nbsp;</p>';
  h += '<p class="best-banner">' + (R.banner ? 'Nouvelle meilleure série !' : '') + '</p>';
  return h;
}

/* ---------- Fin de tour ---------- */
function vOver(){
  var r = S.res, m = r.mode, h = '';
  var fresh = r.fresh !== false; r.fresh = false;
  if(fresh && r.scored && (r.newRecord || r.stars === 3) && r.n > 0) h += confetti();
  var title = r.revision ? 'Révision terminée !' : (r.training ? 'Entraînement terminé !' : (r.countdown ? 'Chrono terminé !' : 'Tour terminé !'));
  h += '<h1>' + title + '</h1><p class="subtitle">' + esc(PROFILE.name) + ' — ' + esc(m.name || m.label) + '</p>';
  h += '<div class="result">';
  h += '<div class="stars' + (fresh ? ' fresh' : '') + '">' + starSVG(r.stars >= 1, 0) + starSVG(r.stars >= 2, 1) + starSVG(r.stars >= 3, 2) + '</div>';
  if(r.scored){
    h += '<p class="stat-label">Score final</p><p class="bigscore">' + r.score + '</p>';
    h += '<p class="res-line">' + r.ok + ' / ' + r.n + ' bonnes réponses (' + r.pct + ' %)' + (r.countdown ? ' en ' + (m.countdown / 60) + ' minutes' : '') + '</p>';
    h += '<p class="rec-line">' + (r.newRecord ? 'Nouveau record !' : 'Record : ' + (r.prevRecord || 0)) + '</p>';
  } else {
    h += '<p class="stat-label">Bonnes réponses</p><p class="bigscore">' + r.ok + ' / ' + r.n + '</p>';
    h += '<p class="res-line">' + r.pct + ' % de réussite (pas de score en entraînement)</p>';
  }
  h += '</div>';
  if(r.newBadges.length){
    h += '<p class="sec-title">Nouveau badge !</p><div class="newbadges">';
    r.newBadges.forEach(function(b){ h += '<div class="newbadge">' + badgeSVG(b.c, true) + '<div><b>' + esc(b.t) + '</b><small>' + esc(b.d) + '</small></div></div>'; });
    h += '</div>';
  }
  h += '<div class="grid" style="grid-template-columns:repeat(2,1fr)">';
  if(!r.revision) h += '<button class="mode-btn" onclick="KE.replay()">Rejouer</button>';
  if(r.errors.length) h += '<button class="mode-btn" onclick="KE.revise()">Retravailler mes erreurs</button>';
  h += '<button class="mode-btn" onclick="KE.toSelect()">' + (r.revision ? 'Terminer' : 'Changer') + '</button></div>';
  h += errorsHtml(r.errors);
  if(r.scored) h += lbHtml();
  return h;
}

/* ---------- Progression ---------- */
function chart14(){
  var data = [], i, max = 5, any = false;
  for(i = 13; i >= 0; i--){
    var x = new Date(); x.setDate(x.getDate() - i);
    var e = PD.daily[dstr(x)] || { ok: 0, ko: 0 };
    if(e.ok + e.ko > 0) any = true;
    max = Math.max(max, e.ok + e.ko);
    data.push({ ok: e.ok, ko: e.ko, day: x.getDate() });
  }
  if(!any) return '<p class="muted">Joue quelques tours pour voir ta progression ici.</p>';
  var s = '<svg class="chart" viewBox="0 0 300 122" role="img" aria-label="Questions des 14 derniers jours">';
  var bw = 16, gap = 5.6, base = 100, hmax = 84;
  data.forEach(function(t, k){
    var xx = 8 + k * (bw + gap), hOk = t.ok / max * hmax, hKo = t.ko / max * hmax;
    if(t.ok) s += '<rect x="' + xx.toFixed(1) + '" y="' + (base - hOk).toFixed(1) + '" width="' + bw + '" height="' + hOk.toFixed(1) + '" rx="2" fill="#30a46c"/>';
    if(t.ko) s += '<rect x="' + xx.toFixed(1) + '" y="' + (base - hOk - hKo).toFixed(1) + '" width="' + bw + '" height="' + hKo.toFixed(1) + '" rx="2" fill="#e5484d"/>';
    s += '<text x="' + (xx + bw / 2).toFixed(1) + '" y="114" font-size="8" text-anchor="middle" fill="#888">' + t.day + '</text>';
  });
  s += '<line x1="4" y1="100.5" x2="296" y2="100.5" stroke="#ddd"/></svg>';
  return s + '<p class="legend"><i style="background:#30a46c"></i>bonnes réponses <i style="background:#e5484d"></i>erreurs</p>';
}
function vProgress(){
  var ok = 0, ko = 0, k, days = 0;
  for(k in PD.stats){ ok += PD.stats[k].ok; ko += PD.stats[k].ko; }
  for(k in PD.daily){ if(PD.daily[k].ok + PD.daily[k].ko > 0) days++; }
  var h = '<div class="head-row">' + profChip() + '</div><h1>Ma progression</h1><p class="subtitle">' + esc(PROFILE.name) + '</p>';
  h += '<div class="cards4">' + stat('Questions', ok + ko) + stat('Réussite', (ok + ko ? Math.round(ok * 100 / (ok + ko)) : 0) + ' %') + stat('Jours', days) + stat('De suite', dayStreak()) + '</div>';
  h += '<p class="sec-title">14 derniers jours</p>' + chart14();
  var arr = [];
  for(k in PD.stats){
    var s = PD.stats[k], n = s.ok + s.ko;
    if(n >= 5) arr.push({ l: s.l, a: s.a, ok: s.ok, n: n, p: s.ok / n });
  }
  arr.sort(function(a, b){ return a.p - b.p; });
  var weak = arr.filter(function(x){ return x.p < 0.9; }).slice(0, 5);
  var strong = arr.slice().reverse().filter(function(x){ return x.p >= 0.9; }).slice(0, 3);
  h += '<p class="sec-title">À travailler</p>';
  if(!arr.length) h += '<p class="muted">Continue de jouer : il faut au moins 5 questions par type pour voir tes points à travailler.</p>';
  else if(!weak.length) h += '<p class="muted">Rien à signaler, tout est maîtrisé !</p>';
  else weak.forEach(function(x){ h += barRow(x, '#e5484d'); });
  if(strong.length){
    h += '<p class="sec-title">Points forts</p>';
    strong.forEach(function(x){ h += barRow(x, '#30a46c'); });
  }
  h += '<p class="sec-title">Derniers tours</p>';
  if(!PD.hist.length) h += '<p class="muted">Aucun tour terminé pour le moment.</p>';
  else {
    h += '<table class="lb-table"><thead><tr><th>Date</th><th>Appli</th><th style="text-align:right">Score</th></tr></thead><tbody>';
    PD.hist.slice(-8).reverse().forEach(function(e){
      h += '<tr><td>' + esc(e.d.slice(8) + '/' + e.d.slice(5, 7)) + '</td><td>' + esc(e.at) + '<br><small class="muted">' + esc(e.ml) + '</small></td><td class="score">' + e.s + '</td></tr>';
    });
    h += '</tbody></table>';
  }
  h += '<p class="sec-title">Mes badges</p><div class="badges">';
  BADGES.forEach(function(b){
    var on = !!PD.badges[b.id];
    h += '<div class="badge' + (on ? '' : ' locked') + '">' + badgeSVG(b.c, on) + '<b>' + esc(b.t) + '</b><small>' + esc(b.d) + '</small></div>';
  });
  h += '</div><button class="chip-btn wide" onclick="KE.toSelect()">Retour</button>';
  return h;
}
function barRow(x, color){
  return '<div class="barrow"><div class="bl"><b>' + esc(x.l) + '</b> <small class="muted">' + esc(x.a) + '</small></div><div class="bar"><i style="width:' + Math.round(x.p * 100) + '%;background:' + color + '"></i></div><div class="bp">' + Math.round(x.p * 100) + ' % (' + x.ok + '/' + x.n + ')</div></div>';
}

function render(){
  var el = document.getElementById('app');
  var h = '';
  switch(S.stage){
    case 'newprofile': h = vNewProfile(); break;
    case 'profiles': h = vProfiles(); break;
    case 'select': h = vSelect(); break;
    case 'playing': h = vPlaying(); break;
    case 'over': h = vOver(); break;
    case 'progress': h = vProgress(); break;
    case 'gate': h = vGate(); break;
    case 'parent': h = vParent(); break;
  }
  el.innerHTML = h;
  if(S.stage === 'playing') updateBar();
  if(S.stage === 'newprofile'){ var inp = document.getElementById('pname'); if(inp && !S.npName) { try { inp.focus(); } catch(e){} } }
  if(S._last !== S.stage){ S._last = S.stage; try { global.scrollTo(0, 0); } catch(e){} }
}

/* ===== Moteur commun : actions (API appelée par les boutons) et démarrage ===== */
KE.pick = function(key){ startRound(key); };
KE.setTraining = function(b){ S.training = !!b; render(); };
KE.profiles = function(){ S.stage = 'profiles'; render(); };
KE.chooseProfile = function(id){ if(useProfile(id)){ S.stage = 'select'; render(); } };
KE.newProfile = function(){ return; };
KE._unusedNew = function(){ S.npName = ''; S.npColor = listProfiles().length % COLORS.length; S.npErr = ''; S.after = null; S.stage = 'newprofile'; render(); };
KE.addProfileFromParent = function(){ return; };
KE._unusedAdd = function(){ S.npName = ''; S.npColor = listProfiles().length % COLORS.length; S.npErr = ''; S.after = 'parent'; S.stage = 'newprofile'; render(); };
KE.npName = function(v){ S.npName = v; };
KE.npColor = function(i){ S.npColor = i; render(); };
KE.npSave = function(){ return; };
KE._unusedSave = function(){
  var n = (S.npName || '').trim();
  if(!n){ S.npErr = 'Écris ton prénom pour continuer.'; render(); return; }
  if(n.length > 20) n = n.slice(0, 20);
  var p = addProfile(n, COLORS[S.npColor || 0]);
  var after = S.after; S.after = null; S.npErr = ''; S.npName = '';
  if(after === 'parent'){ S.stage = 'parent'; S.ptab = 'profiles'; }
  else { useProfile(p.id); S.stage = 'select'; }
  render();
};
KE.npCancel = function(){ S.stage = (S.after === 'parent') ? 'parent' : 'profiles'; S.after = null; render(); };
KE.toSelect = function(){
  clearTimers(); R = null;
  try { if(global.speechSynthesis) global.speechSynthesis.cancel(); } catch(e){}
  S.stage = PROFILE ? 'select' : 'profiles';
  render();
};
KE.progress = function(){ S.stage = 'progress'; render(); };
KE.lbView = function(v){ S.lbView = v; if(S.res) S.res.fresh = false; render(); };

/* Jeu */
KE.key = function(d){
  if(!R || R.answered || R.q.type !== 'number') return;
  if(d === ','){
    if(!R.q.decimal || R.input.indexOf(',') >= 0) return;
    if(R.input === '') R.input = '0';
  }
  if(R.input.length >= 7) return;
  R.input += String(d);
  render();
};
KE.back = function(){ if(!R || R.answered) return; R.input = R.input.slice(0, -1); render(); };
KE.clear = function(){ if(!R || R.answered) return; R.input = ''; render(); };
KE.validate = function(){
  if(!R || R.answered || R.q.type !== 'number' || R.input === '') return;
  var v = parseFloat(R.input.replace(',', '.'));
  if(isNaN(v)) return;
  settle(Math.abs(v - R.q.answer) < 1e-6, R.input, false);
};
KE.choose = function(i){
  if(!R || R.answered || R.q.type !== 'choices') return;
  R.chosen = i;
  settle(R.q.choices[i] === R.q.answer, R.q.choices[i], false);
};
KE.next = function(){ if(R && R.answered && R.training) nextQuestion(); };
KE.speak = function(){ speakQ(); };
KE.quit = function(){ quitRound(); };
KE.replay = function(){ if(S.res) startRound(S.res.mode.key); };
KE.revise = function(){
  if(!S.res || !S.res.errors.length) return;
  var ids = [];
  S.res.errors.forEach(function(e){ if(e.genId && e.genId !== '_fallback') ids.push(e.genId); });
  ids = shuffle(ids).slice(0, 20);
  if(ids.length) startRound(S.res.mode.key, ids);
};

/* Espace parent */
KE.parent = function(){
  var code = Store.get('ke_code', null);
  S.gate = { mode: code ? 'enter' : 'create', buf: '', msg: '' };
  S.stage = 'gate'; render();
};
KE.gkey = function(d){
  var g = S.gate;
  if(g.buf.length >= 4) return;
  g.buf += String(d); g.msg = '';
  if(g.buf.length === 4){
    if(g.mode === 'create'){ Store.set('ke_code', g.buf); S.stage = 'parent'; S.ptab = 'settings'; S.pmsg = ''; }
    else if(g.buf === String(Store.get('ke_code', ''))){ S.stage = 'parent'; S.ptab = 'settings'; S.pmsg = ''; }
    else { g.buf = ''; g.msg = 'Code incorrect.'; }
  }
  render();
};
KE.gback = function(){ S.gate.buf = S.gate.buf.slice(0, -1); render(); };
KE.gcancel = function(){ S.stage = 'select'; render(); };
KE.ptab = function(t){ S.ptab = t; S.pmsg = ''; render(); };
KE.setRounds = function(delta){
  var st = getSettings();
  st.rounds = Math.max(5, Math.min(50, st.rounds + delta));
  putSettings(st); render();
};
KE.setTf = function(v){ var st = getSettings(); st.tf = v; putSettings(st); render(); };
KE.toggleVoice = function(){ var st = getSettings(); st.voice = !st.voice; putSettings(st); render(); };
KE.stepParam = function(key, delta){
  var st = getSettings();
  (CFG.params || []).forEach(function(p){
    if(p.key === key){ st.params[key] = Math.max(p.min, Math.min(p.max, st.params[key] + delta)); }
  });
  putSettings(st); render();
};
KE.resetSettings = function(){
  if(!global.confirm('Rétablir les réglages d\'origine de cette appli ?')) return;
  var all = Store.get('ke_settings', {});
  delete all[CFG.id];
  Store.set('ke_settings', all); render();
};
KE.renameProfile = function(id){ return; };
KE._unusedRename = function(id){
  var a = listProfiles(), i;
  for(i = 0; i < a.length; i++){
    if(a[i].id === id){
      var n = global.prompt('Nouveau prénom :', a[i].name);
      if(n && n.trim()){
        a[i].name = n.trim().slice(0, 20); saveProfiles(a);
        if(PROFILE && PROFILE.id === id) PROFILE.name = a[i].name;
      }
    }
  }
  render();
};
KE.resetProfile = function(id){
  if(!global.confirm('Remettre à zéro les scores, badges et la progression de ce joueur ?')) return;
  savePD(id, blankPD());
  if(PROFILE && PROFILE.id === id) PD = loadPD(id);
  render();
};
KE.deleteProfile = function(id){ return; };
KE._unusedDelete = function(id){
  if(!global.confirm('Supprimer ce joueur et toutes ses données ?')) return;
  var a = listProfiles().filter(function(p){ return p.id !== id; });
  saveProfiles(a); Store.remove('ke_pd_' + id);
  if(PROFILE && PROFILE.id === id){
    PROFILE = null; PD = null; Store.remove('ke_current');
    if(a.length){ S.stage = 'profiles'; } else { S.npName = ''; S.npColor = 0; S.stage = 'newprofile'; }
  }

};
KE.copyExport = function(){
  var txt = exportAll();
  function ok(){ S.pmsg = 'Texte copié.'; render(); }
  function fallback(){
    var ta = document.getElementById('exp');
    try { ta.select(); document.execCommand('copy'); S.pmsg = 'Texte copié.'; } catch(e){ S.pmsg = 'Sélectionne le texte et copie-le à la main.'; }
    render();
  }
  try {
    if(global.navigator.clipboard && global.navigator.clipboard.writeText) global.navigator.clipboard.writeText(txt).then(ok, fallback);
    else fallback();
  } catch(e){ fallback(); }
};
KE.dlExport = function(){
  try {
    var blob = new global.Blob([exportAll()], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = global.URL.createObjectURL(blob);
    a.download = 'sauvegarde-calcul-' + today() + '.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    S.pmsg = 'Fichier téléchargé.';
  } catch(e){ S.pmsg = 'Téléchargement impossible : utilise « Copier ».'; }

};
function importText(txt){
  if(!global.confirm('Remplacer toutes les données de cet appareil par cette sauvegarde ?')) return;
  var err = importAll(txt);

  if(!err && !PROFILE){ S.stage = 'profiles'; }

}

  rd.onload = function(){ importText(String(rd.result)); };
  rd.readAsText(f);

  try {

    for(i = 0; i < global.localStorage.length; i++){ var k = global.localStorage.key(i); if(k && k.indexOf('ke_') === 0) del.push(k); }

/* Démarrage */
KE.run = function(cfg){
  CFG = cfg; REG = {};

    if(global.navigator && 'serviceWorker' in global.navigator && /^https?:$/.test(global.location.protocol)){
      global.navigator.serviceWorker.register('sw.js').catch(function(){});
    }
  } catch(e){}
};

      var h = randInt(1, 3), m = pick([10, 15, 20, 30, 40, 45]);
      return qn('Un film dure ' + h + ' h ' + m + ' min. Combien de minutes cela fait-il ?', 'Un film dure ' + h + ' heures ' + m + ' minutes. Combien de minutes cela fait-il ?', h * 60 + m, h + ' h = ' + (h * 60) + ' min, puis + ' + m + ' min = ' + (h * 60 + m) + ' min.', { time: 35000 });
    }
    var d = pick([12, 15, 18, 20, 25, 30]), hh = randInt(2, 6);
    return qn('Un cycliste roule à ' + d + ' km par heure. Quelle distance parcourt-il en ' + hh + ' heures (en km) ?', 'Un cycliste roule à ' + d + ' kilomètres par heure. Quelle distance parcourt-il en ' + hh + ' heures ?', d * hh, 'En 1 heure : ' + d + ' km. En ' + hh + ' heures : ' + d + ' × ' + hh + ' = ' + (d * hh) + ' km.', { time: 35000 });
  });
  var gPbMisc = G('pbmisc', 'Problèmes de partage et de calcul', function(){
    var t = randInt(1, 3);
    if(t === 1){
      var k = randInt(3, 9), q = randInt(3, 12), n = k * q;
      return qn(n + ' billes sont partagées équitablement entre ' + k + ' enfants. Combien de billes chaque enfant reçoit-il ?', n + ' billes sont partagées équitablement entre ' + k + ' enfants. Combien de billes chaque enfant reçoit-il ?', q, 'Partage équitable : ' + n + ' : ' + k + ' = ' + q + ' (car ' + q + ' × ' + k + ' = ' + n + ').', { time: 35000 });
    }
    if(t === 2){
      var a = randInt(6, 12), b = randInt(3, 9);
      return qn('Un paquet contient ' + a + ' gâteaux. Combien de gâteaux y a-t-il dans ' + b + ' paquets ?', 'Un paquet contient ' + a + ' gâteaux. Combien de gâteaux y a-t-il dans ' + b + ' paquets ?', a * b, explain.mul(a, b), { time: 35000 });
    }
    var p = randInt(120, 320), r = randInt(35, p - 30);
    return qn('Un livre a ' + p + ' pages. Léa en a lu ' + r + '. Combien de pages lui reste-t-il à lire ?', 'Un livre a ' + p + ' pages. Léa en a lu ' + r + '. Combien de pages lui reste-t-il à lire ?', p - r, explain.sub(p, r), { time: 35000 });
  });

  var UN = [['m', 'cm', 100], ['km', 'm', 1000], ['kg', 'g', 1000], ['L', 'mL', 1000], ['L', 'cL', 100], ['cm', 'mm', 10], ['m', 'dm', 10], ['t', 'kg', 1000], ['h', 'min', 60], ['min', 's', 60]];
  var gUnits = G('units', 'Unités de mesure', function(){
    var u = pick(UN), isTime = (u[0] === 'h' || u[0] === 'min');
    var x = isTime ? pick([1, 2, 3, 4, 5, 6, 10, 12]) : pick([1, 2, 3, 4, 5, 6, 8, 9, 12, 15, 20, 2.5, 0.5, 1.5, 3.5, 7.5]);
    var big = x, small = Math.round(x * u[2] * 1000) / 1000;
    if(Math.random() < 0.5){
      return qn(fmt(big) + ' ' + u[0] + ' = ___ ' + u[1], fmt(big) + ' ' + u[0] + ' en ' + u[1], small,
        '1 ' + u[0] + ' = ' + u[2] + ' ' + u[1] + ', donc ' + fmt(big) + ' × ' + u[2] + ' = ' + fmt(small) + ' ' + u[1] + '.', { decimal: true });
    }
    return qn(fmt(small) + ' ' + u[1] + ' = ___ ' + u[0], fmt(small) + ' ' + u[1] + ' en ' + u[0], big,
      'Il faut ' + u[2] + ' ' + u[1] + ' pour faire 1 ' + u[0] + '. ' + fmt(small) + ' : ' + u[2] + ' = ' + fmt(big) + ' ' + u[0] + '.', { decimal: true });
  });

  var sheet = [gAdd, gSubRound, gSubSimple, gRoundAdd, gCompTarget, gMul10, gMulTens, gMulSmall, gDiv10, gDivSmall, gCompMul];

  KE.run({
    id: 'cm2', title: 'Calcul mental CM2', subtitle: 'Choisis ce que tu veux travailler',
    theme: 'green', cols: 2, defaultRounds: 20, defaultTime: 16000,
    modes: [
      { key: 'add_sub', label: 'Addition et soustraction', gens: [gAdd, gAdd, gSubRound, gSubSimple, gRoundAdd, gCompTarget], time: 16000 },
      { key: 'mult_div', label: 'Multiplication et division', gens: [gMul10, gMulTens, gMulSmall, gDiv10, gDivSmall], time: 16000 },
      { key: 'complete', label: 'Compléter à 100 / 1000', gens: [gCompTarget, gCompTarget, gCompMul], time: 16000 },
      { key: 'trous', label: 'Opérations à trous', desc: 'trouver le nombre qui manque', gens: [gInv], time: 18000 },
      { key: 'decimaux', label: 'Nombres décimaux', desc: 'calculs, ×10, ×100, ÷10', gens: [gDecAdd, gDecAdd, gDecMul], time: 24000 },
      { key: 'fractions', label: 'Fractions de quantité', desc: 'les 3/4 de 80...', gens: [gFracQty, gFracQty, gFracDec], time: 22000 },
      { key: 'problemes', label: 'Petits problèmes', desc: 'prix, durées, partages', gens: [gPbPrice, gPbTime, gPbMisc], time: 35000 },
      { key: 'unites', label: 'Unités de mesure', desc: 'm, cm, kg, g, L, h, min...', gens: [gUnits], time: 20000 },
      { key: 'mix', label: 'Mélange (comme la fiche)', gens: sheet, time: 16000 },
      { key: 'chrono3', label: 'Chrono 3 minutes', name: 'Chrono 3 minutes', desc: 'le plus de calculs possible', countdown: 180, gens: sheet }
    ]
  });
})();

})(window);
</script>
