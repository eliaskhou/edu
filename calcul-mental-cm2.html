<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calcul mental CM2</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #eafaf1 0%, #d9f2e3 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 24px 20px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 4px;
    color: #333;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #888;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  .timer-wrap {
    height: 8px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 0 20px;
  }
  .timer-bar {
    height: 100%;
    background: #2fa571;
    width: 100%;
    transition: width 0.1s linear, background 0.2s ease;
  }
  .timer-bar.low { background: #d84343; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { transform: scale(0.95); }
  .mode-btn {
    height: 76px;
    font-size: 16px;
    font-weight: 700;
    background: #cdf0dd;
    color: #16643f;
    line-height: 1.3;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .stat { text-align: center; }
  .stat-label { font-size: 11px; color: #999; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 700; margin: 2px 0 0; color: #333; }
  .change-btn {
    background: #f0f0f0;
    color: #666;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .question {
    text-align: center;
    font-size: 30px;
    font-weight: 800;
    color: #2d2d2d;
    margin: 16px 0 6px;
    letter-spacing: 1px;
  }
  .answer-display {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    min-height: 46px;
    margin: 8px 0 18px;
    color: #16643f;
    letter-spacing: 2px;
    border-bottom: 3px solid #cdf0dd;
    padding-bottom: 8px;
  }
  .answer-display.correct-flash { color: #16794f; border-color: #16794f; }
  .answer-display.wrong-flash { color: #d84343; border-color: #d84343; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .key-btn {
    height: 56px;
    font-size: 22px;
    font-weight: 700;
    background: #f2f2f2;
    color: #333;
  }
  .key-btn.action {
    background: #e8e8e8;
    color: #555;
    font-size: 15px;
  }
  .key-btn.validate {
    background: #2fa571;
    color: #ffffff;
    font-size: 15px;
  }
  .key-btn.validate:disabled {
    opacity: 0.5;
  }
  .feedback {
    text-align: center;
    margin-top: 16px;
    font-size: 15px;
    color: #777;
    min-height: 20px;
  }
  .best-banner {
    text-align: center;
    font-size: 14px;
    color: #16794f;
    margin-top: 6px;
    min-height: 18px;
  }
  .hear-btn {
    display: block;
    margin: 0 auto 14px;
  }
  .name-input {
    width: 100%;
    font-size: 18px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #cdf0dd;
    margin-bottom: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .name-input:focus { outline: none; border-color: #2fa571; }
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 18px;
    font-size: 14px;
  }
  .lb-table th {
    text-align: left;
    padding: 6px 4px;
    color: #999;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #f0f0f0;
  }
  .lb-table td {
    padding: 7px 4px;
    border-bottom: 1px solid #f5f5f5;
  }
  .lb-table td.rank { color: #999; font-weight: 700; width: 24px; }
  .lb-table td.score { text-align: right; font-weight: 700; color: #16643f; }
  .lb-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin: 20px 0 4px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var TIME_LIMIT = 16000; // ms par question
  var ROUND_LENGTH = 20;
  var LB_KEY = 'cm2_leaderboard';
  var state = { stage: 'select', mode: null, pendingMode: null, playerName: '', score: 0, streak: 0, best: 0, question: null, answered: false, input: '', qIndex: 0, correctCount: 0, leaderboard: [] };
  var timerInterval = null;
  var timerStart = null;

  var MODES = {
    add_sub: 'Addition et soustraction',
    mult_div: 'Multiplication et division',
    complete: 'Compléter à 100 / 1000',
    mix: 'Mélange (comme la fiche)'
  };

  function getBestScore(mode){
    try { return parseInt(localStorage.getItem('cm2_best_' + mode) || '0', 10); } catch(e) { return 0; }
  }
  function setBestScore(mode, val){
    try { localStorage.setItem('cm2_best_' + mode, String(val)); } catch(e) {}
  }
  function getLeaderboard(){
    try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch(e) { return []; }
  }
  function addToLeaderboard(entry){
    var lb = getLeaderboard();
    lb.push(entry);
    lb.sort(function(a,b){ return b.score - a.score; });
    lb = lb.slice(0, 10);
    try { localStorage.setItem(LB_KEY, JSON.stringify(lb)); } catch(e) {}
    return lb;
  }

  function pickMode(m){
    state.pendingMode = m;
    state.stage = 'name';
    render();
    setTimeout(function(){
      var inp = document.getElementById('nameInput');
      if(inp) inp.focus();
    }, 50);
  }

  function confirmName(){
    var inp = document.getElementById('nameInput');
    var val = inp ? inp.value.trim() : '';
    var name = val !== '' ? val : 'Joueur';
    var m = state.pendingMode;
    state = { stage: 'playing', mode: m, pendingMode: null, playerName: name, score: 0, streak: 0, best: 0, question: null, answered: false, input: '', qIndex: 0, correctCount: 0, leaderboard: [] };
    nextQuestion();
  }

  function randInt(min, max){
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  function genAddition(){
    var variants = [
      [9, 99, 5, 99],
      [9, 99, 5, 19],
      [100, 310, 9, 199]
    ];
    var v = variants[randInt(0, variants.length - 1)];
    var a = randInt(v[0], v[1]);
    var b = randInt(v[2], v[3]);
    return { text: a + ' + ' + b, answer: a + b, speak: a + ' plus ' + b };
  }

  function genRoundAddition(){
    var a = randInt(1, 9) * 100;
    var b = 1000 - a;
    return { text: a + ' + ' + b, answer: a + b, speak: a + ' plus ' + b };
  }

  function genSubtractionRound(){
    var a = randInt(300, 999);
    var b = randInt(1, Math.floor(a / 100)) * 100;
    return { text: a + ' - ' + b, answer: a - b, speak: a + ' moins ' + b };
  }

  function genSubtractionSimple(){
    var a = randInt(11, 99);
    var b = randInt(1, Math.min(9, a - 1));
    return { text: a + ' - ' + b, answer: a - b, speak: a + ' moins ' + b };
  }

  function genCompleteToTarget(){
    var targets = [100, 100, 100, 400, 1000];
    var target = targets[randInt(0, targets.length - 1)];
    var known;
    if(target === 1000 || target === 400){
      known = randInt(1, target / 10 - 1) * 10;
    } else {
      known = randInt(5, 95);
    }
    var answer = target - known;
    return { text: known + ' + ___ = ' + target, answer: answer, speak: known + ' plus combien égale ' + target };
  }

  function genMultTenHundred(){
    var mult = [10, 100][randInt(0,1)];
    var n = (mult === 10) ? randInt(2, 640) : randInt(2, 58);
    var swap = randInt(0,1) === 1;
    var text = swap ? (mult + ' \u00d7 ' + n) : (n + ' \u00d7 ' + mult);
    return { text: text, answer: n * mult, speak: n + ' fois ' + mult };
  }

  function genMultByTens(){
    var a = randInt(2, 90);
    var b = [10, 20, 30][randInt(0, 2)];
    return { text: a + ' \u00d7 ' + b, answer: a * b, speak: a + ' fois ' + b };
  }

  function genMultSmall(){
    var a = randInt(2, 50);
    var b = randInt(2, 9);
    return { text: a + ' \u00d7 ' + b, answer: a * b, speak: a + ' fois ' + b };
  }

  function genDivisionByTen(){
    var q = randInt(2, 60);
    var n = q * 10;
    return { text: n + ' : 10', answer: q, speak: n + ' divisé par 10' };
  }

  function genDivisionBySmall(){
    var divisors = [2, 3, 4, 5];
    var d = divisors[randInt(0, divisors.length - 1)];
    var q = randInt(10, 230);
    var n = d * q;
    return { text: n + ' : ' + d, answer: q, speak: n + ' divisé par ' + d };
  }

  function genCompleteMult(){
    var target = 100;
    var factors = [];
    for(var f = 2; f <= target; f++){
      if(target % f === 0 && f <= 90 && (target / f) <= 90) factors.push(f);
    }
    var f1 = factors[randInt(0, factors.length - 1)];
    var f2 = target / f1;
    return { text: f1 + ' \u00d7 ___ = ' + target, answer: f2, speak: f1 + ' fois combien égale ' + target };
  }

  function generateFor(mode){
    var pools = {
      add_sub: [genAddition, genAddition, genSubtractionRound, genSubtractionSimple, genRoundAddition, genCompleteToTarget],
      mult_div: [genMultTenHundred, genMultByTens, genMultSmall, genDivisionByTen, genDivisionBySmall],
      complete: [genCompleteToTarget, genCompleteToTarget, genCompleteMult],
      mix: [genAddition, genSubtractionRound, genSubtractionSimple, genRoundAddition, genCompleteToTarget,
            genMultTenHundred, genMultByTens, genMultSmall, genDivisionByTen, genDivisionBySmall, genCompleteMult]
    };
    var pool = pools[mode];
    var fn = pool[randInt(0, pool.length - 1)];
    return fn();
  }

  function nextQuestion(){
    state.qIndex += 1;
    if(state.qIndex > ROUND_LENGTH){
      endRound();
      return;
    }
    var q = generateFor(state.mode);
    state.question = q;
    state.answered = false;
    state.input = '';
    render();
    startTimer();
    speakQuestion(q.speak);
  }

  function endRound(){
    clearInterval(timerInterval);
    state.stage = 'over';
    var prevBest = getBestScore(state.mode);
    var isNewBest = state.score > prevBest;
    if(isNewBest) setBestScore(state.mode, state.score);
    state.leaderboard = addToLeaderboard({ name: state.playerName, score: state.score, mode: state.mode });
    render(false, false, isNewBest);
  }

  function speakQuestion(text){
    try {
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.85;
      utterance.pitch = 1.1;
      window.speechSynthesis.speak(utterance);
    } catch(e) {}
  }

  function startTimer(){
    clearInterval(timerInterval);
    timerStart = Date.now();
    updateTimerBar();
    timerInterval = setInterval(function(){
      var elapsed = Date.now() - timerStart;
      if(elapsed >= TIME_LIMIT){
        clearInterval(timerInterval);
        if(!state.answered) timeUp();
      } else {
        updateTimerBar();
      }
    }, 100);
  }

  function updateTimerBar(){
    var bar = document.getElementById('timer-bar');
    if(!bar) return;
    var elapsed = Date.now() - timerStart;
    var pct = Math.max(0, 100 - (elapsed / TIME_LIMIT) * 100);
    bar.style.width = pct + '%';
    if(pct < 30) bar.classList.add('low'); else bar.classList.remove('low');
  }

  function timeUp(){
    state.answered = true;
    state.streak = 0;
    render();
    setTimeout(nextQuestion, 1400);
  }

  function pressKey(k){
    if(state.answered) return;
    if(state.input.length >= 5) return;
    state.input += String(k);
    render();
  }

  function backspace(){
    if(state.answered) return;
    state.input = state.input.slice(0, -1);
    render();
  }

  function clearInput(){
    if(state.answered) return;
    state.input = '';
    render();
  }

  function validate(){
    if(state.answered) return;
    if(state.input === '') return;
    state.answered = true;
    clearInterval(timerInterval);
    var given = parseInt(state.input, 10);
    var wasNewBest = false;
    var correct = given === state.question.answer;
    if(correct){
      state.score += 10;
      state.streak += 1;
      state.correctCount += 1;
      if(state.streak > state.best){ state.best = state.streak; wasNewBest = state.streak >= 3; }
    } else {
      state.streak = 0;
    }
    render(wasNewBest, correct);
    setTimeout(nextQuestion, 1300);
  }

  function reset(){
    clearInterval(timerInterval);
    state = { stage: 'select', mode: null, pendingMode: null, playerName: '', score: 0, streak: 0, best: 0, question: null, answered: false, input: '', qIndex: 0, correctCount: 0, leaderboard: [] };
    render();
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function leaderboardHtml(){
    if(state.leaderboard.length === 0) return '';
    var rows = state.leaderboard.map(function(e, i){
      return '<tr><td class="rank">'+(i+1)+'</td><td>'+escapeHtml(e.name)+'</td><td>'+MODES[e.mode]+'</td><td class="score">'+e.score+'</td></tr>';
    }).join('');
    return '<p class="lb-title">Les 10 meilleurs scores</p>' +
      '<table class="lb-table"><thead><tr><th>#</th><th>Prénom</th><th>Mode</th><th style="text-align:right;">Score</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function render(newBest, correct, roundNewBest){
    var el = document.getElementById('app');

    if(state.stage === 'select'){
      var buttons = '';
      Object.keys(MODES).forEach(function(key){
        var rec = getBestScore(key);
        buttons += '<button class="mode-btn" onclick="window.__pick(\''+key+'\')">'+MODES[key]+
          (rec > 0 ? '<br><span style="font-size:11px;font-weight:400;">Record : '+rec+'</span>' : '') +
          '</button>';
      });
      el.innerHTML =
        '<h1>Calcul mental CM2</h1>' +
        '<p class="subtitle">Choisis ce que tu veux travailler (20 questions)</p>' +
        '<div class="grid">' + buttons + '</div>';
      return;
    }

    if(state.stage === 'name'){
      el.innerHTML =
        '<h1>'+MODES[state.pendingMode]+'</h1>' +
        '<p class="subtitle">Quel est ton prénom ?</p>' +
        '<input type="text" id="nameInput" class="name-input" placeholder="Ton prénom" maxlength="20" onkeydown="if(event.key===\'Enter\')window.__confirmName()">' +
        '<button class="mode-btn" style="width:100%;" onclick="window.__confirmName()">Commencer</button>';
      return;
    }

    if(state.stage === 'over'){
      var pct = Math.round((state.correctCount / ROUND_LENGTH) * 100);
      el.innerHTML =
        '<h1>Tour terminé !</h1>' +
        '<p class="subtitle">'+escapeHtml(state.playerName)+' — '+MODES[state.mode]+'</p>' +
        '<div style="text-align:center;margin:20px 0;">' +
          '<p class="stat-label">Score final</p>' +
          '<p style="font-size:44px;font-weight:800;color:#16643f;margin:4px 0;">'+state.score+'</p>' +
          '<p style="font-size:15px;color:#666;margin:0;">'+state.correctCount+' / '+ROUND_LENGTH+' bonnes réponses ('+pct+'%)</p>' +
          '<p style="font-size:15px;color:#16794f;margin:6px 0 0;">'+(roundNewBest ? 'Nouveau record !' : 'Meilleur score : '+getBestScore(state.mode))+'</p>' +
        '</div>' +
        '<div class="grid">' +
          '<button class="mode-btn" onclick="window.__pick(\''+state.mode+'\')">Rejouer</button>' +
          '<button class="mode-btn" onclick="window.__reset()">Changer</button>' +
        '</div>' +
        leaderboardHtml();
      return;
    }

    var q = state.question;
    var displayClass = 'answer-display';
    if(state.answered) displayClass += correct ? ' correct-flash' : ' wrong-flash';
    var displayText = state.input !== '' ? state.input : (state.answered ? String(q.answer) : '&nbsp;');

    var feedback = '';
    if(state.answered){
      feedback = correct
        ? 'Bravo, bonne réponse !'
        : 'Pas tout à fait, la réponse était ' + q.answer + '.';
    }

    var banner = (newBest) ? 'Nouvelle meilleure série !' : '';

    el.innerHTML =
      '<div class="top-bar">' +
        '<div class="stat"><p class="stat-label">Question</p><p class="stat-value">'+state.qIndex+'/'+ROUND_LENGTH+'</p></div>' +
        '<div class="stat"><p class="stat-label">Score</p><p class="stat-value">'+state.score+'</p></div>' +
        '<div class="stat"><p class="stat-label">Série</p><p class="stat-value">'+state.streak+' *</p></div>' +
        '<button class="change-btn" onclick="window.__reset()">Changer</button>' +
      '</div>' +
      '<div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>' +
      '<p class="question">'+q.text+'</p>' +
      '<button class="change-btn hear-btn" onclick="window.__speak()">Réécouter</button>' +
      '<div class="'+displayClass+'">'+displayText+'</div>' +
      '<div class="keypad">' +
        '<button class="key-btn" onclick="window.__key(1)">1</button>' +
        '<button class="key-btn" onclick="window.__key(2)">2</button>' +
        '<button class="key-btn" onclick="window.__key(3)">3</button>' +
        '<button class="key-btn" onclick="window.__key(4)">4</button>' +
        '<button class="key-btn" onclick="window.__key(5)">5</button>' +
        '<button class="key-btn" onclick="window.__key(6)">6</button>' +
        '<button class="key-btn" onclick="window.__key(7)">7</button>' +
        '<button class="key-btn" onclick="window.__key(8)">8</button>' +
        '<button class="key-btn" onclick="window.__key(9)">9</button>' +
        '<button class="key-btn action" onclick="window.__clear()">Effacer</button>' +
        '<button class="key-btn" onclick="window.__key(0)">0</button>' +
        '<button class="key-btn action" onclick="window.__back()">&#8592;</button>' +
      '</div>' +
      '<button class="key-btn validate" style="width:100%;margin-top:10px;height:52px;" ' +
        (state.answered ? 'disabled' : '') + ' onclick="window.__validate()">Valider</button>' +
      '<p class="feedback">'+feedback+'</p>' +
      '<p class="best-banner">'+banner+'</p>';
  }

  window.__pick = pickMode;
  window.__confirmName = confirmName;
  window.__key = pressKey;
  window.__back = backspace;
  window.__clear = clearInput;
  window.__validate = validate;
  window.__reset = reset;
  window.__speak = function(){ if(state.question) speakQuestion(state.question.speak); };
  render();
})();
</script>
</body>
</html>
