<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tables de multiplication</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #fef6e4 0%, #fdf0d5 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }
  #app {
    width: 100%;
    max-width: 420px;
    background: #ffffff;
    border-radius: 20px;
    padding: 24px 20px 28px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
  }
  h1 {
    text-align: center;
    font-size: 22px;
    margin: 0 0 4px;
    color: #333;
  }
  .subtitle {
    text-align: center;
    font-size: 14px;
    color: #888;
    margin: 0 0 20px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .timer-wrap {
    height: 8px;
    background: #f0f0f0;
    border-radius: 4px;
    overflow: hidden;
    margin: 0 0 20px;
  }
  .timer-bar {
    height: 100%;
    background: #e08a1e;
    width: 100%;
    transition: width 0.1s linear, background 0.2s ease;
  }
  .timer-bar.low { background: #d84343; }
  button {
    font-family: inherit;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    transition: transform 0.1s ease, opacity 0.2s ease;
    -webkit-user-select: none;
    user-select: none;
  }
  button:active { transform: scale(0.95); }
  .table-btn {
    height: 64px;
    font-size: 22px;
    font-weight: 700;
    background: #ffe3a3;
    color: #7a4e00;
  }
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 18px;
    flex-wrap: wrap;
    gap: 6px;
  }
  .stat { text-align: center; }
  .stat-label { font-size: 11px; color: #999; margin: 0; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 20px; font-weight: 700; margin: 2px 0 0; color: #333; }
  .change-btn {
    background: #f0f0f0;
    color: #666;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 10px;
  }
  .question {
    text-align: center;
    font-size: 36px;
    font-weight: 800;
    color: #2d2d2d;
    margin: 16px 0 6px;
  }
  .answer-display {
    text-align: center;
    font-size: 32px;
    font-weight: 800;
    min-height: 46px;
    margin: 8px 0 18px;
    color: #7a4e00;
    letter-spacing: 2px;
    border-bottom: 3px solid #ffe3a3;
    padding-bottom: 8px;
  }
  .answer-display.correct-flash { color: #16794f; border-color: #16794f; }
  .answer-display.wrong-flash { color: #d84343; border-color: #d84343; }
  .keypad {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .key-btn {
    height: 56px;
    font-size: 22px;
    font-weight: 700;
    background: #f2f2f2;
    color: #333;
  }
  .key-btn.action {
    background: #e8e8e8;
    color: #555;
    font-size: 15px;
  }
  .key-btn.validate {
    background: #e08a1e;
    color: #ffffff;
    font-size: 15px;
  }
  .key-btn.validate:disabled {
    opacity: 0.5;
  }
  .feedback {
    text-align: center;
    margin-top: 16px;
    font-size: 15px;
    color: #777;
    min-height: 20px;
  }
  .best-banner {
    text-align: center;
    font-size: 14px;
    color: #16794f;
    margin-top: 6px;
    min-height: 18px;
  }
  .hear-btn {
    display: block;
    margin: 0 auto 14px;
  }
  .name-input {
    width: 100%;
    font-size: 18px;
    padding: 12px 14px;
    border-radius: 12px;
    border: 2px solid #ffe3a3;
    margin-bottom: 16px;
    box-sizing: border-box;
    text-align: center;
  }
  .name-input:focus { outline: none; border-color: #e08a1e; }
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    margin-top: 18px;
    font-size: 14px;
  }
  .lb-table th {
    text-align: left;
    padding: 6px 4px;
    color: #999;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 2px solid #f0f0f0;
  }
  .lb-table td {
    padding: 7px 4px;
    border-bottom: 1px solid #f5f5f5;
  }
  .lb-table td.rank { color: #999; font-weight: 700; width: 24px; }
  .lb-table td.score { text-align: right; font-weight: 700; color: #7a4e00; }
  .lb-title {
    font-size: 15px;
    font-weight: 700;
    color: #333;
    margin: 20px 0 4px;
    text-align: center;
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
(function(){
  var TIME_LIMIT = 8000; // ms par question
  var ROUND_LENGTH = 20;
  var LB_KEY = 'ttg_leaderboard';
  var state = { stage: 'select', table: null, pendingTable: null, playerName: '', score: 0, streak: 0, best: 0, question: null, answered: false, input: '', qIndex: 0, correctCount: 0, leaderboard: [] };
  var timerInterval = null;
  var timerStart = null;

  function getBestScore(table){
    try { return parseInt(localStorage.getItem('ttg_best_' + table) || '0', 10); } catch(e) { return 0; }
  }
  function setBestScore(table, val){
    try { localStorage.setItem('ttg_best_' + table, String(val)); } catch(e) {}
  }
  function getLeaderboard(){
    try { return JSON.parse(localStorage.getItem(LB_KEY) || '[]'); } catch(e) { return []; }
  }
  function addToLeaderboard(entry){
    var lb = getLeaderboard();
    lb.push(entry);
    lb.sort(function(a,b){ return b.score - a.score; });
    lb = lb.slice(0, 10);
    try { localStorage.setItem(LB_KEY, JSON.stringify(lb)); } catch(e) {}
    return lb;
  }

  function pickTable(t){
    state.pendingTable = t;
    state.stage = 'name';
    render();
    setTimeout(function(){
      var inp = document.getElementById('nameInput');
      if(inp) inp.focus();
    }, 50);
  }

  function confirmName(){
    var inp = document.getElementById('nameInput');
    var val = inp ? inp.value.trim() : '';
    var name = val !== '' ? val : 'Joueur';
    var t = state.pendingTable;
    state = { stage: 'playing', table: t, pendingTable: null, playerName: name, score: 0, streak: 0, best: 0, question: null, answered: false, input: '', qIndex: 0, correctCount: 0, leaderboard: [] };
    nextQuestion();
  }

  function nextQuestion(){
    state.qIndex += 1;
    if(state.qIndex > ROUND_LENGTH){
      endRound();
      return;
    }
    var b = Math.floor(Math.random()*6)+6; // 6..11
    var answer = state.table * b;
    state.question = { b: b, answer: answer };
    state.answered = false;
    state.input = '';
    render();
    startTimer();
    speakQuestion(state.table, b);
  }

  function endRound(){
    clearInterval(timerInterval);
    state.stage = 'over';
    var prevBest = getBestScore(state.table);
    var isNewBest = state.score > prevBest;
    if(isNewBest) setBestScore(state.table, state.score);
    state.leaderboard = addToLeaderboard({ name: state.playerName, score: state.score, table: state.table });
    render(false, false, isNewBest);
  }

  function speakQuestion(table, b){
    try {
      if(!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      var utterance = new SpeechSynthesisUtterance(table + ' fois ' + b);
      utterance.lang = 'fr-FR';
      utterance.rate = 0.9;
      utterance.pitch = 1.1;
      window.speechSynthesis.speak(utterance);
    } catch(e) {}
  }

  function startTimer(){
    clearInterval(timerInterval);
    timerStart = Date.now();
    updateTimerBar();
    timerInterval = setInterval(function(){
      var elapsed = Date.now() - timerStart;
      if(elapsed >= TIME_LIMIT){
        clearInterval(timerInterval);
        if(!state.answered) timeUp();
      } else {
        updateTimerBar();
      }
    }, 100);
  }

  function updateTimerBar(){
    var bar = document.getElementById('timer-bar');
    if(!bar) return;
    var elapsed = Date.now() - timerStart;
    var pct = Math.max(0, 100 - (elapsed / TIME_LIMIT) * 100);
    bar.style.width = pct + '%';
    if(pct < 30) bar.classList.add('low'); else bar.classList.remove('low');
  }

  function timeUp(){
    state.answered = true;
    state.streak = 0;
    render();
    setTimeout(nextQuestion, 1300);
  }

  function pressKey(k){
    if(state.answered) return;
    if(state.input.length >= 4) return;
    state.input += String(k);
    render();
  }

  function backspace(){
    if(state.answered) return;
    state.input = state.input.slice(0, -1);
    render();
  }

  function clearInput(){
    if(state.answered) return;
    state.input = '';
    render();
  }

  function validate(){
    if(state.answered) return;
    if(state.input === '') return;
    state.answered = true;
    clearInterval(timerInterval);
    var given = parseInt(state.input, 10);
    var wasNewBest = false;
    var correct = given === state.question.answer;
    if(correct){
      state.score += 10;
      state.streak += 1;
      state.correctCount += 1;
      if(state.streak > state.best){ state.best = state.streak; wasNewBest = state.streak >= 3; }
    } else {
      state.streak = 0;
    }
    render(wasNewBest, correct);
    setTimeout(nextQuestion, 1200);
  }

  function reset(){
    clearInterval(timerInterval);
    state = { stage: 'select', table: null, pendingTable: null, playerName: '', score: 0, streak: 0, best: 0, question: null, answered: false, input: '', qIndex: 0, correctCount: 0, leaderboard: [] };
    render();
  }

  function leaderboardHtml(){
    if(state.leaderboard.length === 0) return '';
    var rows = state.leaderboard.map(function(e, i){
      return '<tr><td class="rank">'+(i+1)+'</td><td>'+escapeHtml(e.name)+'</td><td>Table '+e.table+'</td><td class="score">'+e.score+'</td></tr>';
    }).join('');
    return '<p class="lb-title">Les 10 meilleurs scores</p>' +
      '<table class="lb-table"><thead><tr><th>#</th><th>Prénom</th><th>Table</th><th style="text-align:right;">Score</th></tr></thead><tbody>' + rows + '</tbody></table>';
  }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(newBest, correct, roundNewBest){
    var el = document.getElementById('app');

    if(state.stage === 'select'){
      var buttons = '';
      for(var i=6;i<=11;i++){
        var rec = getBestScore(i);
        buttons += '<button class="table-btn" onclick="window.__pick('+i+')">'+i+
          (rec > 0 ? '<br><span style="font-size:11px;font-weight:400;">Record : '+rec+'</span>' : '') +
          '</button>';
      }
      el.innerHTML =
        '<h1>Tables de multiplication</h1>' +
        '<p class="subtitle">Choisis une table à pratiquer (20 questions)</p>' +
        '<div class="grid">' + buttons + '</div>';
      return;
    }

    if(state.stage === 'name'){
      el.innerHTML =
        '<h1>Tables de multiplication</h1>' +
        '<p class="subtitle">Table de '+state.pendingTable+' — Quel est ton prénom ?</p>' +
        '<input type="text" id="nameInput" class="name-input" placeholder="Ton prénom" maxlength="20" onkeydown="if(event.key===\'Enter\')window.__confirmName()">' +
        '<button class="table-btn" style="width:100%;" onclick="window.__confirmName()">Commencer</button>';
      return;
    }

    if(state.stage === 'over'){
      var pct = Math.round((state.correctCount / ROUND_LENGTH) * 100);
      el.innerHTML =
        '<h1>Tour terminé !</h1>' +
        '<p class="subtitle">'+escapeHtml(state.playerName)+' — Table de '+state.table+'</p>' +
        '<div style="text-align:center;margin:20px 0;">' +
          '<p class="stat-label">Score final</p>' +
          '<p style="font-size:44px;font-weight:800;color:#7a4e00;margin:4px 0;">'+state.score+'</p>' +
          '<p style="font-size:15px;color:#666;margin:0;">'+state.correctCount+' / '+ROUND_LENGTH+' bonnes réponses ('+pct+'%)</p>' +
          '<p style="font-size:15px;color:#16794f;margin:6px 0 0;">'+(roundNewBest ? 'Nouveau record pour cette table !' : 'Meilleur score : '+getBestScore(state.table))+'</p>' +
        '</div>' +
        '<div class="grid" style="grid-template-columns:repeat(2,1fr);">' +
          '<button class="table-btn" onclick="window.__pick('+state.table+')">Rejouer</button>' +
          '<button class="table-btn" onclick="window.__reset()">Changer</button>' +
        '</div>' +
        leaderboardHtml();
      return;
    }

    var q = state.question;
    var displayClass = 'answer-display';
    if(state.answered) displayClass += correct ? ' correct-flash' : ' wrong-flash';
    var displayText = state.input !== '' ? state.input : (state.answered ? String(q.answer) : '&nbsp;');

    var feedback = '';
    if(state.answered){
      feedback = correct
        ? 'Bravo, bonne réponse !'
        : 'Pas tout à fait, la réponse était ' + q.answer + '.';
    }

    var banner = (newBest) ? 'Nouvelle meilleure série !' : '';

    el.innerHTML =
      '<div class="top-bar">' +
        '<div class="stat"><p class="stat-label">Question</p><p class="stat-value">'+state.qIndex+'/'+ROUND_LENGTH+'</p></div>' +
        '<div class="stat"><p class="stat-label">Score</p><p class="stat-value">'+state.score+'</p></div>' +
        '<div class="stat"><p class="stat-label">Série</p><p class="stat-value">'+state.streak+' *</p></div>' +
        '<button class="change-btn" onclick="window.__reset()">Changer</button>' +
      '</div>' +
      '<div class="timer-wrap"><div class="timer-bar" id="timer-bar"></div></div>' +
      '<p class="question">'+state.table+' &times; '+q.b+' = ?</p>' +
      '<button class="change-btn hear-btn" onclick="window.__speak()">Réécouter</button>' +
      '<div class="'+displayClass+'">'+displayText+'</div>' +
      '<div class="keypad">' +
        '<button class="key-btn" onclick="window.__key(1)">1</button>' +
        '<button class="key-btn" onclick="window.__key(2)">2</button>' +
        '<button class="key-btn" onclick="window.__key(3)">3</button>' +
        '<button class="key-btn" onclick="window.__key(4)">4</button>' +
        '<button class="key-btn" onclick="window.__key(5)">5</button>' +
        '<button class="key-btn" onclick="window.__key(6)">6</button>' +
        '<button class="key-btn" onclick="window.__key(7)">7</button>' +
        '<button class="key-btn" onclick="window.__key(8)">8</button>' +
        '<button class="key-btn" onclick="window.__key(9)">9</button>' +
        '<button class="key-btn action" onclick="window.__clear()">Effacer</button>' +
        '<button class="key-btn" onclick="window.__key(0)">0</button>' +
        '<button class="key-btn action" onclick="window.__back()">&#8592;</button>' +
      '</div>' +
      '<button class="key-btn validate" style="width:100%;margin-top:10px;height:52px;" ' +
        (state.answered ? 'disabled' : '') + ' onclick="window.__validate()">Valider</button>' +
      '<p class="feedback">'+feedback+'</p>' +
      '<p class="best-banner">'+banner+'</p>';
  }

  window.__pick = pickTable;
  window.__confirmName = confirmName;
  window.__key = pressKey;
  window.__back = backspace;
  window.__clear = clearInput;
  window.__validate = validate;
  window.__reset = reset;
  window.__speak = function(){ if(state.question) speakQuestion(state.table, state.question.b); };
  render();
})();
</script>
</body>
</html>
